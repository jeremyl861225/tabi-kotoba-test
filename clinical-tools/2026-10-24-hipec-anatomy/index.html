<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HIPEC 溫熱灌注機</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(720px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><p class="hp-top"><a href="../../">← 所有測試</a> · <a href="dark.html">深色版</a></p><style>.iso {
  --hp-perfuse: #d2452c;
  --hp-return: #b07a00;
  --hp-recirc: #7b4bb8;
  --hp-heat: #e0622b;
  --hp-vacuum: #2f63c9;
  --hp-fluid: #2b8f55;
  --hp-drug: #b8337f;
  --hp-temp: #0f8b8d;
  --hp-safety: #18181a;
  --hp-glass: #1d2a33;
  --hp-glass-line: #4e6676;
  --hp-ui: #d6e3ea;
  --hp-ui-dim: #7d93a1;
  --hp-ui-warm: #ffb08a;
  --hp-liquid: #e9a07d;
  --hp-liquid-cool: #cfe1ea;
  --hp-cavity: #ece9e3;
  --hp-dial: #fbfaf7;
  --hp-ink-flow: #8a8a86;
  --hp-btn-ring: #00000016;
  --hp-btn-hover: #0000000a;
}
.iso[data-theme="dark"] {
  --hp-perfuse: #ff7a62;
  --hp-return: #f2c94c;
  --hp-recirc: #c193f0;
  --hp-heat: #ff9a5c;
  --hp-vacuum: #7fa6ff;
  --hp-fluid: #5fd38f;
  --hp-drug: #f07bbd;
  --hp-temp: #4fd6d0;
  --hp-safety: #ffffff;
  --hp-glass: #0c1418;
  --hp-glass-line: #36505f;
  --hp-ui: #c6d6df;
  --hp-ui-dim: #5f7684;
  --hp-ui-warm: #ffb08a;
  --hp-liquid: #8a4a33;
  --hp-liquid-cool: #33505e;
  --hp-cavity: #1f1f1e;
  --hp-dial: #262624;
  --hp-ink-flow: #8f8f8a;
  --hp-btn-ring: #ffffff14;
  --hp-btn-hover: #ffffff0a;
}

.hp-stage { position: relative; outline: none; touch-action: pan-y; }
.hp-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.hp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* screen, drawn in the plane of the sloped housing */
.hp-glass { fill: var(--hp-glass); stroke: none; }
.hp-ui text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--hp-ui); }
.hp-ui .dim { fill: var(--hp-ui-dim); }
.hp-ui .warm { fill: var(--hp-ui-warm); }
.hp-ui .bar { fill: var(--hp-glass-line); }
.hp-ui .cell { fill: none; stroke: var(--hp-glass-line); stroke-width: .25; }
.hp-ui .key { fill: var(--hp-glass-line); opacity: .55; }
.hp-ui .key-on { fill: var(--hp-ui); }
.hp-ui .key-on + text { fill: var(--hp-glass); }

/* liquids: the reservoir seen through its clear wall, the pool in the basin */
.hp-liquid { fill: color-mix(in srgb, var(--hp-liquid-cool) calc(100% - var(--hp-warm, 0) * 100%), var(--hp-liquid)); opacity: .55; stroke: none; mix-blend-mode: multiply; }
.iso[data-theme="dark"] .hp-liquid { mix-blend-mode: screen; opacity: .45; }
.hp-level { fill: none; stroke: var(--anatomy-lo); stroke-width: var(--anatomy-weight); vector-effect: non-scaling-stroke; opacity: .9; }
.hp-cavity { fill: var(--hp-cavity); stroke: none; }
.hp-floor { fill: var(--anatomy-shade-1); stroke: none; opacity: .5; }
.hp-holed path { fill-rule: evenodd; }
.hp-pool { fill: color-mix(in srgb, var(--hp-liquid-cool) calc(100% - var(--hp-warm, 0) * 100%), var(--hp-liquid)); stroke: none; }
.hp-pool-edge { fill: none; stroke: var(--anatomy-lo); stroke-width: var(--anatomy-weight); vector-effect: non-scaling-stroke; }

/* parts drawn in a face plane */
.hp-arm { fill: var(--anatomy-shade-1); stroke: none; }
.hp-roller { fill: var(--anatomy-top); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); vector-effect: non-scaling-stroke; }
.hp-roller-hub { fill: var(--anatomy-mid); stroke: none; }
.hp-knob { fill: var(--anatomy-shade-0); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); vector-effect: non-scaling-stroke; }
.hp-wand { fill: var(--anatomy-shade-2); stroke: none; }
.hp-dial { fill: var(--hp-dial); stroke: none; }

/* flow marks: on every line that is moving fluid, coloured on the selected circuit */
.hp-flow { fill: none; stroke: none; vector-effect: none; }
.it[data-flow] .hp-flow {
  stroke: var(--hp-ink-flow);
  stroke-width: .55;
  stroke-linecap: round;
  stroke-dasharray: 1 4;
  stroke-dashoffset: calc(var(--t, 0) - var(--o, 0));
  opacity: .75;
}
.it[data-flow][data-on] .hp-flow { stroke: var(--hp-c); stroke-width: .75; stroke-dasharray: 1.2 3.6; opacity: 1; }

/* selection: the chosen circuit becomes the one lit accent */
.it[data-on] .iso-top, .it[data-on] .tb-shine { fill: var(--anatomy-lit-top); }
.it[data-on] .iso-shade { fill: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-shade { stroke: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-top { stroke: var(--anatomy-lit-top); }
.it[data-on] .tb-body { fill: color-mix(in srgb, var(--hp-c) 16%, var(--anatomy-paper)); }
.it[data-on] .tb-shade { fill: color-mix(in srgb, var(--hp-c) 30%, var(--anatomy-paper)); }
.it[data-on] .tb-edge, .it[data-on] .iso-edge { stroke: var(--hp-c); }
.it[data-on] .iso-line[data-tone="hi"] { stroke: var(--hp-c); }
.hp-stage[data-sel] .it[data-circ]:not([data-on]) .tb-edge { stroke: var(--anatomy-mid); }
.hp-stage[data-sel] .it[data-circ]:not([data-on]) .tb-shine { fill: var(--anatomy-shade-3); }

/* controls under the card */
.hp-controls { margin-top: 14px; display: grid; gap: 10px; }
.hp-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hp-row-label { font-family: var(--anatomy-mono); font-size: 10.5px; letter-spacing: .1em; color: var(--anatomy-muted); margin-right: 4px; min-width: 3.4em; }
.hp-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border: 0; border-radius: 999px;
  background: var(--anatomy-card); color: var(--anatomy-text); font: 13px/1 ui-sans-serif, system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
  cursor: pointer; box-shadow: inset 0 0 0 1px var(--hp-btn-ring);
  transition: background 200ms var(--anatomy-ease), color 200ms var(--anatomy-ease), transform 160ms var(--anatomy-ease);
}
.hp-btn:hover { background: var(--hp-btn-hover); }
.hp-btn:active { transform: scale(.97); }
.hp-btn:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 3px; }
.hp-btn[aria-pressed="true"] { color: var(--anatomy-strong); box-shadow: inset 0 0 0 1px var(--anatomy-strong); }
.hp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--d); flex: none; }
.hp-note { font-size: 13.5px; line-height: 1.75; color: var(--anatomy-text); min-height: 4.6em; margin: 0; }
.hp-note b { color: var(--anatomy-strong); font-weight: 600; }
.hp-caption { font-size: 12.5px; line-height: 1.7; color: var(--anatomy-muted); }
.hp-caption a { color: inherit; }
.iso-plate-corner { font-family: var(--anatomy-mono), "PingFang TC", sans-serif; }

@media (prefers-reduced-motion: reduce) {
  .hp-btn { transition: none; }
}

/* settings panel */
.hp-panel { border-radius: 14px; padding: 14px 16px 12px; background: var(--anatomy-card); box-shadow: var(--anatomy-lift); }
.hp-panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }
.hp-panel h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--anatomy-strong); }
.hp-sub { font-size: 12px; color: var(--anatomy-muted); }
.hp-reset { margin-left: auto; height: 26px; font-size: 12px; }
.hp-fields { display: grid; gap: 6px; }
.hp-field { display: grid; grid-template-columns: 8.4em 1fr 5.4em 4.6em; align-items: center; gap: 10px; font-size: 13px; color: var(--anatomy-text); }
.hp-flabel { color: var(--anatomy-strong); }
.hp-field input[type="range"] { width: 100%; accent-color: var(--anatomy-hi); }
.hp-field input[type="number"] { width: 100%; font: 13px/1.2 var(--anatomy-mono); text-align: right; color: var(--anatomy-strong); background: var(--anatomy-page); border: 0; border-radius: 7px; padding: 5px 6px; box-shadow: inset 0 0 0 1px var(--hp-btn-ring); }
.hp-unit { font-size: 11.5px; color: var(--anatomy-muted); white-space: nowrap; }
.hp-presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
.hp-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hp-res { display: grid; gap: 1px; padding: 8px 10px; border-radius: 10px; background: var(--anatomy-page); }
.hp-res span { font-size: 11.5px; color: var(--anatomy-muted); }
.hp-res b { font: 600 18px/1.2 var(--anatomy-mono); color: var(--anatomy-strong); }
.hp-res small { font-size: 11px; color: var(--anatomy-muted); }
.hp-warn { margin: 10px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--anatomy-red); }
.hp-warn:empty { display: none; }
.hp-proto { margin: 8px 0 0; font-size: 12.5px; line-height: 1.65; color: var(--anatomy-text); }
.hp-proto:empty { display: none; }
@media (max-width: 520px) {
  .hp-field { grid-template-columns: 1fr 5.2em 4.4em; grid-template-areas: "l n u" "r r r"; row-gap: 2px; }
  .hp-field .hp-flabel { grid-area: l; }
  .hp-field input[type="range"] { grid-area: r; }
  .hp-field input[type="number"] { grid-area: n; }
  .hp-field .hp-unit { grid-area: u; }
  .hp-results { grid-template-columns: repeat(2, 1fr); }
}

.hp-top { margin: 0 0 14px; font-size: 13px; text-align: right; }
.hp-top a { color: var(--anatomy-muted); }

.hp-stripe { fill: var(--hp-perfuse); stroke: none; }
.hp-screw { fill: var(--anatomy-mid); stroke: none; }
.hp-ripple { fill: none; stroke: color-mix(in srgb, var(--hp-liquid) 50%, var(--anatomy-paper)); stroke-width: .6; vector-effect: non-scaling-stroke; opacity: 0; }
.hp-ripples[data-on] .hp-ripple { animation: hp-ripple 2.4s calc(var(--i) * -0.8s) linear infinite; }
@keyframes hp-ripple { 0% { opacity: 0; } 30% { opacity: .9; } 100% { opacity: 0; } }

const DEFAULT = { rate: 1000, target: 42.5, tin: 41.0, plimit: 300, vac: 80, minutes: 90 };
const KEY = "hipec-pump:v1";
const state = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && typeof saved === "object") return { ...DEFAULT, ...saved };
  } catch {}
  return { ...DEFAULT };
})();
const save = () => {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch {}
};
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const fmt1 = (n) => (Math.round(n * 10) / 10).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const HEATER_W = 1400;
const CP = 4.18; // J/g·°C, water
const P_PER_FLOW = 0.125; // mmHg per mL/min, from the manual's example screen (1,000 mL/min, 125 mmHg)
const AMBIENT = 24;

const MODES = {
  prime: { name: "預充", key: "PRIME", valve: "recirc", heat: false, flows: ["supply", "pumpseg", "heated", "recirc", "spike"], res: 0.12, pool: 0, vac: 0 },
  line: { name: "管路預充", key: "PT. LINE PRIME", valve: "perfuse", heat: false, flows: ["supply", "pumpseg", "heated", "perf", "inflow"], res: 0.1, pool: 0.04, vac: 0 },
  perfuse: { name: "灌注", key: "PERFUSE", valve: "perfuse", heat: true, flows: ["supply", "pumpseg", "heated", "perf", "inflow", "drain.a", "drain.b", "ret", "vac"], res: 0.36, pool: 0.62, vac: null },
  purge: { name: "自動除氣", key: "REMOVING AIR", valve: "recirc", heat: true, flows: ["supply", "pumpseg", "heated", "recirc", "drain.a", "drain.b", "ret", "vac"], res: 0.42, pool: 0.56, vac: null },
  drain: { name: "回收", key: "STOP", valve: "recirc", heat: false, flows: ["drain.a", "drain.b", "ret", "vac"], res: 0.8, pool: 0, vac: 150 },
};
const MODE_ORDER = Object.keys(MODES);
let mode = "perfuse";

function physics() {
  const m = MODES[mode];
  const set = mode === "prime" ? 500 : mode === "line" ? 400 : mode === "purge" ? Math.max(state.rate, 500) : mode === "drain" ? 0 : state.rate;
  const cap = state.plimit / P_PER_FLOW;
  const rate = mode === "perfuse" ? Math.min(set, cap) : set;
  const limited = mode === "perfuse" && set > cap;
  const pressure = m.valve === "perfuse" ? rate * P_PER_FLOW : 0;
  const gps = rate / 60;
  const rise = gps ? HEATER_W / (gps * CP) : Infinity;
  const reach = state.tin + rise;
  const tpump = m.heat ? Math.min(state.target, reach) : null;
  const need = m.heat && gps ? gps * CP * Math.max(0, state.target - state.tin) : 0;
  const vac = m.vac ?? state.vac;
  return { rate, set, limited, pressure, need, reach, tpump, vac, purgeEvery: rate ? 2000 / rate : Infinity };
}

// ---------- screen (in the plane of the sloped housing, x right, y down the slope) ----------

const MODE_TEXT = {

function apply() {

// ---------- motion ----------
let angle = 0;
let speed = 0;
let wandAngle = 0;
let needleAngle = 0;
let resShown = MODES.perfuse.res;

function paintLiquids() {

// line families share one dash phase
for (const el of svg.querySelectorAll(".it[data-route]")) {

// ---------- input ----------
document.querySelectorAll(".hp-btn[data-circ]").forEach((b) => b.addEventListener("click", () => select(sel === b.dataset.circ ? null : b.dataset.circ)));

// ---------- settings panel ----------
const FIELDS = [

const presetsEl = document.querySelector("[data-presets]");
