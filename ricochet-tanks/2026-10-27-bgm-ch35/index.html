<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第三、五章配樂</title>
<meta name="theme-color" content="#EDEFF3">
<style>
  :root { --ink: #252B40; --ink-2: #4E5D87; --dim: #8790AB; --bg: #EDEFF3; --card: #fff; --line: rgb(78 93 135 / 0.16);
    --yellow: #F8C21A; --cyan: #2BB2CB; --plum: #5E3A5E; --mint: #0E9F7C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 48px); }
  a { color: #13849A; }
  .back { font-size: 14px; text-decoration: none; color: var(--ink-2); }
  h1 { font-size: 24px; margin: 10px 0 4px; letter-spacing: 0.04em; }
  .lead { color: var(--ink-2); margin: 0 0 12px; }
  h2 { font-size: 18px; margin: 28px 0 10px; display: flex; align-items: baseline; gap: 8px; }
  h2 small { font-size: 13px; color: var(--dim); font-weight: 500; }
  .track { --ac: var(--yellow); --acd: #9A7408; background: var(--card); border-radius: 18px; padding: 12px 14px 10px; margin: 0 0 12px;
    box-shadow: 0 0 0 0.5px var(--line), 0 10px 26px -16px rgb(36 46 80 / 0.4); border-left: 5px solid var(--ac); }
  .track[data-slot="b"] { --ac: var(--cyan); --acd: #13849A; }
  .tt b span.pick { display: inline-block; margin-left: 6px; font: 700 11px/1 -apple-system, sans-serif; padding: 4px 7px; border-radius: 999px; background: #E3F4F8; color: #13849A; vertical-align: 2px; }
  .track[data-slot="boss"] { --ac: var(--plum); --acd: var(--plum); }
  .head { display: flex; align-items: center; gap: 12px; }
  .btn { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--ac); color: #fff; cursor: pointer;
    display: grid; place-items: center; box-shadow: 0 8px 18px -10px var(--acd); -webkit-tap-highlight-color: transparent; }
  .track:not([data-slot="boss"]) .btn { color: var(--ink); }
  .btn:active { transform: scale(0.95); }
  .btn svg { width: 22px; height: 22px; }
  .btn .pause, .track.on .btn .play { display: none; }
  .track.on .btn .pause { display: block; }
  .tt { min-width: 0; flex: 1; }
  .tt b { display: block; font-size: 17.5px; line-height: 1.3; }
  .tt b em { font-style: normal; color: var(--acd); margin-right: 6px; }
  .tt span { display: block; color: var(--dim); font-size: 13px; }
  .lic { white-space: nowrap; flex: none; align-self: flex-start; font: 700 11.5px/1 -apple-system, sans-serif; padding: 5px 8px; border-radius: 999px; letter-spacing: 0.03em; }
  .lic.cc0 { background: #E2F6EF; color: #0B7A5F; }
  .lic.by { background: #FFF2CC; color: #8A6400; }
  .bar { position: relative; height: 24px; margin: 8px 0 0; cursor: pointer; touch-action: none; }
  .bar::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 2px; background: rgb(78 93 135 / 0.14); }
  .bar i { position: absolute; left: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--ac); width: 0; }
  .bar i::after { content: ""; position: absolute; right: -7px; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 0 3px #fff, 0 1px 4px rgb(0 0 0 / 0.25); }
  .time { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: -2px; }
  .desc { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
  .desc a { font-size: 13px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0 14px; }
  th, td { padding: 7px 6px; border-bottom: 0.5px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--dim); font-weight: 600; }
  .note { font-size: 13.5px; color: var(--ink-2); }
</style>
</head>
<body>
<main>
<a class="back" href="../../">← 所有測試</a>
<h1>第三、五章配樂（重找）</h1>
<p class="lead">照你選的：第一、二、四、六章用 A（Heroic Loop、Children's March Theme、Sci-fi Puzzle In-Game 1、8-bit Mechanical Complex）。第三章冰原、第五章草叢伏擊重新找，每章三首，全部可商用，音量已調成一樣大。</p>
<p class="note">標著「先放進 App」的是我先放進下一版 App 的那首，你挑了別首我再換。</p>
<div id="list"></div>
<h2>選好之後告訴我</h2>
<p class="note">例如「3B 5A」。都不喜歡就說想要的感覺，我再找。我沒辦法自己聽，是照作者的描述與標籤挑的。</p>
</main>
<script>
  const TRACKS = [
    { ch: 3, k: 'A', file: 'diamond', name: 'Black Diamond', by: 'Joth', lic: 'cc0', len: '201 秒一輪', pick: 1, url: 'https://opengameart.org/content/black-diamond', desc: '快速的液態鼓打貝斯（143 BPM），作者說用了很多冬天的音色，寫給滑雪板遊戲或冰原關卡。比較偏電子。' },
    { ch: 3, k: 'B', file: 'winter', name: 'Stage 3 (Winter)', by: 'wyver9', lic: 'by', len: '51 秒', url: 'https://opengameart.org/content/super-helmknight-ost-16-bit-game-boy-advance-style', desc: 'GBA 風格的冬天關卡，老派管弦取樣混方波。比較短，作者沒說能不能無縫循環。' },
    { ch: 3, k: 'C', file: 'icy', name: 'Icy Adventure', by: 'TheFrenchDodo', lic: 'cc0', len: '96 秒一輪', url: 'https://opengameart.org/content/retro-tunes', desc: '復古電玩風格（80、90 年代加一點現代感），檔名就寫可無縫循環；頁面沒有寫這首的氣氛。' },
    { ch: 5, k: 'A', file: 'bamboo', name: 'Bamboo Blitz', by: 'Tsorthan Grove', lic: 'cc0', len: '77 秒一輪', pick: 1, url: 'https://opengameart.org/content/bamboo-blitz', desc: '部落鼓節奏推著走，上面一段明亮的木琴旋律；作者說適合秘密神殿、快節奏追逐。' },
    { ch: 5, k: 'B', file: 'backup', name: 'Backup Plan', by: 'Zane Little', lic: 'cc0', len: '192 秒', url: 'https://opengameart.org/content/backup-plan', desc: '紅白機／超任風的搶劫劇情曲，有戲劇張力；跟標題、第一章同一位作者。這個檔不是循環版。' },
    { ch: 5, k: 'C', file: 'heist', name: 'Heavy Heist', by: 'bertsz', lic: 'cc0', len: '133 秒', url: 'https://opengameart.org/content/heavy-heist', desc: '晶片音樂加電吉他與鼓的潛入搶劫曲（標籤：heist、stealth、heavy）。' },
  ];
  const CH = ['', '第一章・訓練場', '第二章・軟木前線', '第三章・冰原', '第四章・傳送迷宮', '第五章・草叢伏擊', '第六章・炸藥工廠'];
  const LIC = { cc0: 'CC0', by: 'CC BY 4.0' };
  const PLAY = '<svg class="play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg><svg class="pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>';
  let html = '', last = 0;
  TRACKS.forEach((t) => {
    if (t.ch !== last) { last = t.ch; html += `<h2>${CH[t.ch]}</h2>`; }
    html += `<section class="track" data-slot="b" data-src="${t.file}.m4a">
      <div class="head"><button class="btn" aria-label="播放 ${t.name}">${PLAY}</button>
        <div class="tt"><b><em>${t.ch}${t.k}</em>${t.name}${t.pick ? '<span class="pick">先放進 App</span>' : ''}</b><span>${t.by}・${t.len}</span></div>
        <span class="lic ${t.lic}">${LIC[t.lic]}</span></div>
      <div class="bar"><i></i></div>
      <div class="time"><span class="cur">0:00</span><span class="dur">–</span></div>
      <p class="desc">${t.desc} <a href="${t.url}" target="_blank" rel="noopener">來源與授權 ↗</a></p>
    </section>`;
  });
  document.getElementById('list').innerHTML = html;
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const players = [...document.querySelectorAll('.track')].map((el) => {
    const a = new Audio(el.dataset.src);
    a.loop = true; a.preload = 'metadata';
    const fill = el.querySelector('.bar i'), cur = el.querySelector('.cur'), dur = el.querySelector('.dur');
    const draw = () => { const d = a.duration || 0; fill.style.width = (d ? (a.currentTime / d) * 100 : 0) + '%'; cur.textContent = fmt(a.currentTime); };
    a.addEventListener('loadedmetadata', () => { dur.textContent = fmt(a.duration); });
    a.addEventListener('timeupdate', draw);
    a.addEventListener('play', () => el.classList.add('on'));
    a.addEventListener('pause', () => el.classList.remove('on'));
    el.querySelector('.btn').addEventListener('click', () => {
      if (a.paused) { players.forEach((p) => p !== a && p.pause()); a.play(); } else a.pause();
    });
    const bar = el.querySelector('.bar');
    const seek = (e) => { const r = bar.getBoundingClientRect(); const k = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); if (a.duration) { a.currentTime = k * a.duration; draw(); } };
    bar.addEventListener('pointerdown', (e) => { bar.setPointerCapture(e.pointerId); seek(e); });
    bar.addEventListener('pointermove', (e) => { if (bar.hasPointerCapture(e.pointerId)) seek(e); });
    return a;
  });
</script>
</body>
</html>
