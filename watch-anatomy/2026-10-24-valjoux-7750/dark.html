<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Valjoux 7750 計時機芯</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(780px,100% - 32px);margin:64px auto 96px}

  --vj-jewel: #c0304a;
  --vj-jewel-ring: #e8a5ae;
  --vj-btn-ring: #00000016;
  --vj-btn-hover: #0000000a;
}
.iso[data-theme="dark"] {
  --vj-jewel: #ff6f86;
  --vj-jewel-ring: #7a3240;
  --vj-btn-ring: #ffffff14;
  --vj-btn-hover: #ffffff0a;
}
.vj-stage { position: relative; outline: none; touch-action: pan-y; }
.vj-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.vj-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.vj-top { margin: 0 0 10px; font-size: 13px; text-align: right; }
.vj-top a { color: var(--anatomy-muted); }
.vj-holed path { fill-rule: evenodd; }

/* parts that turn in their own plane: a stack of copies, the base outlined, the top lit */
.vj-base { fill: var(--anatomy-shade-3); stroke: var(--anatomy-lo); stroke-width: var(--anatomy-weight); stroke-linejoin: round; }
.vj-side { fill: var(--anatomy-shade-1); stroke: none; }
.vj-side[data-tone="hi"] { fill: var(--anatomy-shade-0); }
.vj-top { fill: var(--anatomy-top); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); stroke-linejoin: round; }
.vj-top[data-tone="hi"] { stroke: var(--anatomy-hi); }
.vj-edge { fill: none; stroke: var(--anatomy-hi); stroke-width: var(--anatomy-weight); stroke-linejoin: round; }
.vj-top.vj-lit { stroke: var(--anatomy-lit); fill: var(--anatomy-lit-top); }
.vj-arm { fill: var(--anatomy-top); stroke: var(--anatomy-hi); stroke-width: var(--anatomy-weight); }
.vj-top.vj-lit ~ .vj-arm { stroke: var(--anatomy-lit); fill: var(--anatomy-lit-top); }
.vj-hub, .vj-collet { fill: var(--anatomy-shade-1); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); }
.vj-dot { fill: var(--anatomy-mid); stroke: none; }
.vj-heart { fill: var(--anatomy-shade-0); stroke: var(--anatomy-hi); stroke-width: var(--anatomy-weight); }
.vj-finger { fill: var(--anatomy-shade-1); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); }
.vj-pinion { fill: var(--anatomy-shade-1); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); }
.vj-pin { fill: var(--anatomy-shade-0); stroke: var(--anatomy-hi); stroke-width: var(--anatomy-weight); }
.vj-hair { fill: none; stroke: var(--anatomy-lit); stroke-width: calc(var(--anatomy-weight) * 0.8); opacity: .9; }
.vj-jewel, .vj-jewelc { fill: var(--vj-jewel); stroke: var(--vj-jewel-ring); stroke-width: calc(var(--anatomy-weight) * .8); }

/* a selected part: its outline lit */
.it[data-sel] .iso-edge, .it[data-sel] .vj-top, .it[data-sel] .vj-base { stroke: var(--anatomy-lit); }
.it[data-sel] .vj-top { fill: var(--anatomy-lit-top); }
.it { cursor: pointer; }
.it[data-part=""] { cursor: default; }

/* controls under the card */
.vj-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.vj-btn { font: inherit; font-size: 13px; color: var(--anatomy-text); background: transparent; border: 1px solid var(--vj-btn-ring); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.vj-btn:hover { background: var(--vj-btn-hover); }
.vj-btn[aria-pressed="true"] { border-color: var(--anatomy-lit); }
.vj-btn kbd { font: 11px var(--anatomy-mono); color: var(--anatomy-muted); }
.vj-parts { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 12px 0 6px; padding: 0; list-style: none; }
.vj-part { font: inherit; font-size: 12.5px; color: var(--anatomy-muted); background: none; border: 0; padding: 2px 0; cursor: pointer; }
.vj-part:hover, .vj-part[aria-pressed="true"] { color: var(--anatomy-text); }
.vj-part span { font: 10.5px var(--anatomy-mono); margin-right: 4px; opacity: .7; }
.vj-note { font-size: 13.5px; line-height: 1.7; color: var(--anatomy-text); min-height: 3.4em; margin: 6px 0 10px; }
.vj-caption { font-size: 12.5px; line-height: 1.75; color: var(--anatomy-muted); }
.vj-caption p { margin: 0 0 8px; }
.vj-caption a { color: inherit; }
@media (max-width: 520px) {
  .vj-btn { font-size: 12px; padding: 5px 10px; }
}

/* layer stepper */
.vj-layers { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
.vj-steps { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; flex: 1 1 auto; justify-content: center; flex-wrap: wrap; }
.vj-step { font: inherit; font-size: 12.5px; color: var(--anatomy-muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 6px; cursor: pointer; }
.vj-step:hover { color: var(--anatomy-text); }
.vj-step[aria-current="step"] { color: var(--anatomy-text); border-bottom-color: var(--anatomy-lit); }
.vj-layer-note { font-size: 14px; line-height: 1.75; color: var(--anatomy-text); margin: 8px 0 4px; min-height: 5.2em; }
.vj-layer-note b { font-weight: 600; }

<div class="vj-caption">
  <p>Valjoux 7750 是 1973–74 年由 Edmond Capt 主導設計的自動上鍊計時機芯，現由 ETA 生產。ETA 官方規格：直徑 30.00 mm（13¼ 法分）、高 7.90 mm、25 石、每小時 28,800 次（4 Hz）、ETACHRON 快慢針、典型動力儲存 54 小時；計時 60 秒／30 分／12 小時，凸輪式切換、兩個按把，單向自動上鍊，日期星期可快調，對時停秒。早期版本只有 17 石，網路上動力儲存常見 42–48 小時的舊數字。</p>
  <p>計時的切換機構全在機芯背面、擺陀底下：2 點按把推操作桿轉動凸輪，凸輪把擺動小齒輪擺進計時秒輪、同時放開煞車；再按一次就反過來。停止後按 4 點按把，歸零錘一次打在兩個心形凸輪上，秒輪與分鐘計數輪轉回零位。12 小時計數在 6 點，由發條盒帶動，裝在錶盤側，這張圖看不到。</p>
  <p>刻意的簡化：零件的位置是依實物照片與結構說明排列的示意，不是製造圖；齒數除了擒縱輪 20 齒、分鐘計數 30 格之外都是示意；擺陀每轉一圈補多少動力、錶冠上滿要幾圈、擺幅隨動力下降的比例都是示意值。擺輪的擺動是實際的 4 Hz，太快時可以開慢動作。</p>
  <p>依據：<a href="https://portal.eta.ch/en/7750-7750-5.html">ETA 7750 官方規格</a>、<a href="https://monochrome-watches.com/valjoux-7750-chronograph-history-50-years-technical-explanation-evolution-clones-in-depth-review">Monochrome Watches 的 7750 技術說明</a>、<a href="https://revolution.watch/oscillating-pinion-the-unsung-chronograph-coupling-solution/">Revolution 談擺動小齒輪</a>。</p>

    const tx = (D.EX[0] * m[0] + D.EY[0] * m[1] + D.EZ[0] * m[2]) * share + node.extra[0];
    const ty = (D.EX[1] * m[0] + D.EY[1] * m[1] + D.EZ[1] * m[2]) * share + node.extra[1];
    const fade = mode === "peel" ? 1 - smooth(0.25, 0.95, share) : 1;
    if (fade !== node.fade) {
      node.fade = fade;
      if (fade >= 1) node.el.style.removeProperty("opacity");
      else node.el.style.opacity = fade.toFixed(3);
      node.el.style.display = fade < 0.01 ? "none" : "";
    }
    const text = Math.abs(tx) < 0.005 && Math.abs(ty) < 0.005 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }
  const share = (n) => (layer[n.piece] ? layer[n.piece].x : 0);
  const lift = (n) => (mode === "peel" && layer[n.piece] ? PEEL * D.V[2] : n.lift);
  const next = nodes.map((_, i) => i).sort((a, b) => nodes[a].key + lift(nodes[a]) * share(nodes[a]) - (nodes[b].key + lift(nodes[b]) * share(nodes[b])));
  if (next.some((v, i) => v !== order[i])) {
    const frag = document.createDocumentFragment();
    for (const i of next) frag.appendChild(nodes[i].el);
    set.appendChild(frag);
    order = next;
  }
}

// ---------- the movement's own model ----------
const HZ = 4; // 28,800 vibrations per hour
const BEATS = 2 * HZ;
const RESERVE_MAX = 54; // hours, ETA typical
const ROTOR_GAIN = 2.6 / 60; // hours per rotor turn in the winding direction (illustrative)
const CROWN_GAIN = RESERVE_MAX / 40; // a full wind in about 40 crown turns (illustrative)
const M = {
  t: 0,
  reserve: 38,
  running: false,
  elapsed: 0, // chronograph seconds
  runnerReset: null, // { from, t } while the hearts fly back
  minuteReset: null,
  cam: 0,
  camShown: 0,
  couple: -1, // -1 out, 0 in mesh
  brake: 0, // 0 on the rim, 1 lifted
  hammer: 0,
  opLever: 0,
  rsLever: 0,
  push10: 0,
  push8: 0,
  rotor: 0,
  rotorV: 0,
  drag: null,
  ratchet: 0,
  crownwheel: 0,
  clickw: 0,
  reduction: 0,
  windLeft: 0,
  amplitude: 0,
  scale: 1,
  touring: !still.matches,
};
const ROT = {};
for (const el of svg.querySelectorAll("[data-rot]")) (ROT[el.dataset.rot] ??= []).push(el);
const setRot = (key, deg) => {
  const list = ROT[key];
  if (!list) return;
  const text = `rotate(${deg.toFixed(3)})`;
  if (list.shown === text) return;
  list.shown = text;
  for (const el of list) el.setAttribute("transform", text);
};
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const follow = (cur, target, dt, sec) => (still.matches ? target : cur + (target - cur) * (1 - Math.exp(-dt / sec)));

function amplitudeOf(reserve) {
  if (reserve <= 0) return 0;
  // about 290° fully wound, falling off over the last hours (illustrative)
  return 180 + 110 * Math.min(1, reserve / 30) - 60 * Math.max(0, 1 - reserve / 4);
}

function hairPath(theta) {
  const H = D.hair;
  const N = 900;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const f = i / N;
    const ang = f * H.turns * 2 * Math.PI;
    // inner end turns with the balance, the outer end is held at the stud; the coils breathe
    const twist = (theta * Math.PI) / 180 * (1 - f);
    const r = H.r0 + (H.r1 - H.r0) * f * (1 - 0.018 * Math.sin((theta * Math.PI) / 180) * (1 - f));
    pts.push(`${(r * Math.cos(ang + twist)).toFixed(2)} ${(r * Math.sin(ang + twist)).toFixed(2)}`);
  }
  return "M" + pts.join("L");
}

function pushStart() {
  if (M.reserve <= 0) return say("發條沒有動力了：先轉錶冠或讓擺陀晃一晃。");
  M.push10 = 1;
  M.opLever = 1;
  M.cam += 1;
  M.running = !M.running;
  if (M.running) M.runnerReset = M.minuteReset = null;
  say(M.running ? "開始：凸輪轉一格，擺動小齒輪擺進計時秒輪，煞車抬開。" : "停止：擺動小齒輪擺開，煞車壓住秒輪，指針停在原地。");
  kick();
}
function pushReset() {
  M.push8 = 1;
  if (M.running) {
    say("計時進行中，凸輪擋住歸零錘，4 點按把按不下去。先按 2 點按把停止。");
    kick();
    return;
  }
  M.rsLever = 1;
  M.hammer = 1;
  M.runnerReset = { from: runnerDeg(), t: 0 };
  M.minuteReset = { from: minuteDeg(), t: 0 };
  M.elapsed = 0;
  say("歸零：歸零錘打在兩個心形凸輪上，凸輪最低點轉向錘面，秒輪與分鐘計數輪回到零。");
  kick();
}
function wind() {
  M.windLeft += 1;
  say("轉錶冠：錶冠輪帶動發條盒棘輪，止逆爪一格一格卡住。");
  kick();
}
function say(text) {
  if (note) note.textContent = text;
  status.textContent = text;
}

const runnerDeg = () => (M.elapsed % 60) * 6;
const minuteSteps = () => Math.floor(M.elapsed / 60) % 30;
const minuteDeg = () => -minuteSteps() * 12 - stepping() * 12;
function stepping() {
  // the finger meets the intermediate wheel during the last second of each turn
  const s = M.elapsed % 60;
  return s > 59 ? ease(s - 59) : 0;
}

let lastRotorDeg = 0;
function tick(dt) {
  const sdt = dt * M.scale;
  M.t += sdt;
  clock += dt;
  // reserve runs down in real time
  M.reserve = Math.max(0, M.reserve - sdt / 3600);
  const target = amplitudeOf(M.reserve);
  M.amplitude = follow(M.amplitude, target, dt, 1.5);
  const live = M.amplitude > 5;
  // balance and hairspring
  const phase = 2 * Math.PI * HZ * M.t;
  const theta = live ? M.amplitude * Math.sin(phase) : 0;
  setRot("balance", theta);
  if (hair) hair.setAttribute("d", hairPath(theta));
  // escapement: one beat each time the balance swings through its centre
  const beats = live ? Math.floor((phase / Math.PI) + 0.5) : (M.beats ?? 0);
  if (live) M.beats = beats;
  const beatFrac = live ? ease(Math.min(1, (((phase / Math.PI) + 0.5) % 1) * 6)) : 1;
  const beat = (M.beats ?? 0) - 1 + beatFrac;
  setRot("escape", -beat * 9); // 20 teeth, two beats per tooth
  setRot("pallet", (beats % 2 ? 1 : -1) * 5 * (1 - 2 * (1 - beatFrac)) * 0 + ((M.beats ?? 0) % 2 ? 5 : -5));
  const fourth = (beat / BEATS) * 6;
  setRot("fourth", fourth);
  setRot("third", -fourth / 7.5);
  setRot("centre", fourth / 60);
  setRot("osc", -fourth * (22 / 3.8));
  setRot("barrel", -fourth / 360);
  // chronograph
  if (M.running && live) M.elapsed += sdt;
  let rDeg = runnerDeg();
  if (M.running && live) rDeg = Math.floor(M.elapsed * BEATS) / BEATS * 6 % 360;
  if (M.runnerReset) {
    M.runnerReset.t += dt * 3;
    const f = ease(M.runnerReset.t);
    const from = M.runnerReset.from > 180 ? M.runnerReset.from - 360 : M.runnerReset.from;
    rDeg = from * (1 - f);
    if (M.runnerReset.t >= 1) M.runnerReset = null;
  }
  setRot("runner", rDeg);
  let mDeg = minuteDeg();
  if (M.minuteReset) {
    M.minuteReset.t += dt * 3;
    const f = ease(M.minuteReset.t);
    mDeg = M.minuteReset.from * (1 - f);
    if (M.minuteReset.t >= 1) M.minuteReset = null;
  }
  setRot("minute", mDeg);
  setRot("inter", (Math.floor(M.elapsed / 60) + stepping()) * 36);
  M.camShown = follow(M.camShown, M.cam * 24, dt, 0.08);
  setRot("cam", M.camShown);
  M.couple = follow(M.couple, M.running ? 0 : -1, dt, 0.06);
  setRot("coupling", M.couple * 4);
  M.brake = follow(M.brake, M.running ? 1 : 0, dt, 0.06);
  setRot("brake", M.brake * 5);
  M.hammer = follow(M.hammer, 0, dt, 0.35);
  setRot("hammer", -M.hammer * 9);
  M.opLever = follow(M.opLever, 0, dt, 0.12);
  setRot("operating", M.opLever * 4);
  M.rsLever = follow(M.rsLever, 0, dt, 0.12);
  setRot("reset", -M.rsLever * 4);
  M.push10 = follow(M.push10, 0, dt, 0.12);
  M.push8 = follow(M.push8, 0, dt, 0.12);
  for (const node of nodes) {
    const p = node.part === "start" && node.name.startsWith("case.pusher") ? M.push10 : node.part === "reset" && node.name.startsWith("case.pusher") ? M.push8 : null;
    if (p === null) continue;
    const v = node.part === "start" ? D.push.start : D.push.reset;
    node.extra = [v[0] * p, v[1] * p];
  }
  // rotor: a wrist's swing during the tour, or the pointer
  if (M.drag) {
    // set by pointer events
  } else if (M.touring && !still.matches) {
    const tt = clock;
    M.rotorTarget = 95 * Math.sin(tt * 1.3) + 55 * Math.sin(tt * 0.47 + 1.1) + 30 * Math.sin(tt * 2.9);
    M.rotor = M.rotorTarget;
  } else {
    M.rotor += M.rotorV * dt;
    M.rotorV *= Math.exp(-dt * 1.2);
  }
  const dRot = M.rotor - lastRotorDeg;
  lastRotorDeg = M.rotor;
  setRot("rotor", M.rotor);
  // winding only while the rotor turns clockwise as seen from the back (negative here)
  if (dRot < 0) {
    const turns = -dRot / 360;
    M.reserve = Math.min(RESERVE_MAX, M.reserve + turns * ROTOR_GAIN);
    M.clickw += -dRot * 3.2;
    M.reduction -= -dRot * 0.9;
    M.ratchet += -dRot * 0.06;
  } else {
    // the click wheel slips: only its driving pinion turns
    M.clickw += dRot * 0.4;
  }
  // crown winding
  if (M.windLeft > 0) {
    const step = Math.min(M.windLeft, dt * 1.4);
    M.windLeft -= step;
    M.reserve = Math.min(RESERVE_MAX, M.reserve + step * CROWN_GAIN);
    M.crownwheel -= step * 360 * 0.9;
    M.ratchet += step * 360 * 0.34;
  }
  setRot("clickw", M.clickw);
  setRot("reduction", M.reduction);
  setRot("ratchet", M.ratchet);
  setRot("crownwheel", M.crownwheel);
  readout.textContent = readText();
}
function readText() {
  const s = M.elapsed;
  const mm = Math.floor(s / 60) % 30;
  const ss = s % 60;
  const hh = Math.floor(s / 1800) % 12;
  const chrono = `${hh ? `${hh}:` : ""}${String(mm).padStart(2, "0")}:${ss.toFixed(1).padStart(4, "0")}`;
  const head = M.running ? "計時" : s > 0 ? "停止" : "歸零";
  return `${head} ${chrono} · 動力 ${M.reserve.toFixed(1)} h · ${M.scale < 1 ? "慢動作" : "4 Hz"}`;
}

// ---------- loop ----------
let raf = 0;
let last = 0;
let visible = true;
function frame(now) {
  raf = 0;
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
  last = now;
  let moving = false;
  for (const id of LAYERS) if (steer(layer[id], dt)) moving = true;
  tick(dt);
  place();
  camera(dt);
  void moving;
  if (visible && !still.matches) raf = requestAnimationFrame(frame);
  else last = 0;
}
function kick() {
  if (!raf) raf = requestAnimationFrame(frame);
}
new IntersectionObserver((entries) => {
  visible = entries.some((e) => e.isIntersecting);
  if (visible) kick();
}).observe(stage);
document.addEventListener("visibilitychange", () => {
  visible = !document.hidden;
  if (visible) kick();
});

// ---------- input ----------
const PART_TEXT = {
  rotor: "擺陀：半月形重錘，裝在中心的滾珠軸承上。只有背面看順時針轉時才上鍊，反方向空轉（單向自動上鍊）。可以用滑鼠或手指拖著它轉。",
  auto: "自動上鍊模組：擺陀中心小齒輪 → 單向棘爪輪 → 減速輪 → 發條盒棘輪。把擺陀很多圈的擺動換成發條一點點上緊。",
  cbridge: "計時橋板：托住計時秒輪、分鐘計數輪等計時零件的上樞。",
  cam: "凸輪（coulisse）：沖壓成型、分層的凸輪，取代昂貴的導柱輪。每按一次 2 點按把轉一格，決定擺動小齒輪、煞車與歸零錘的位置。",
  start: "操作桿：把 2 點按把的推力傳到凸輪，讓它轉一格。",
  reset: "歸零桿：把 4 點按把的推力傳到歸零錘。計時進行中時凸輪擋住它。",
  hammer: "歸零錘：一支桿上兩個錘面，同時打在計時秒輪與分鐘計數輪的心形凸輪上，把兩者推回零位。",
  osc: "擺動小齒輪：一根短軸兩端各一個小齒輪，下面由四輪帶動，上面在開始時擺進計時秒輪的齒（Heuer 1887 年的專利設計）。齒很小，咬合時秒針不會跳。",
  brake: "煞車桿：停止時壓住計時秒輪的輪緣，讓秒針停在原地；開始時被凸輪抬開。",
  runner: "計時秒輪：在中心，每分鐘一圈，帶計時秒針。上面有心形凸輪（歸零用）與一根撥指，每轉一圈撥一下分鐘計數輪。",
  minute: "分鐘計數輪：30 齒，每分鐘被撥指推一齒，定位簧把它固定在每一格；上面的心形凸輪讓它一起歸零。12 小時計數在錶盤側，由發條盒帶動。",
  fourth: "四輪：每分鐘一圈，帶 9 點小秒針，同時驅動擺動小齒輪，所以計時秒輪跟走時同步。",
  train: "三輪與輪系夾板：三輪把中心輪的動力傳到四輪；夾板固定各輪的上樞。",
  escape: "擒縱輪：20 齒，擺輪每擺一次放行半齒，所以 4 Hz 時每 5 秒轉一圈。",
  pallet: "擒縱叉：兩顆紅寶石叉瓦輪流鎖住、放開擒縱輪；叉頭每次推擺輪的圓盤釘一下，補回擺輪損失的能量。",
  balance: "擺輪與游絲：每秒來回擺 4 次（28,800 次／小時）。游絲內端跟著擺輪轉、外端固定在夾板上，所以擺動時一圈圈收放。擺幅隨動力儲存下降。",
  cock: "擺輪夾板與 ETACHRON 快慢針：撥動快慢針改變游絲有效長度來調快慢；夾板中央的寶石托住擺軸上樞。",
  barrel: "發條盒棘輪、錶冠輪與止逆爪：錶冠或擺陀上鍊時棘輪轉動，止逆爪一格一格卡住不讓它倒轉。官方典型動力儲存 54 小時。",
  plate: "主夾板：所有輪系與夾板的基座，直徑 30.00 mm、整顆機芯高 7.90 mm。",
  case: "錶殼中層：錶背已拆下，機芯背面朝上。",
  crown: "錶冠：第 1 段轉動上鍊；第 2 段快調日期星期；第 3 段對時，此時擺輪停止（停秒）。點它可以上鍊。",
};
let picked = null;
function pick(part) {
  picked = picked === part ? null : part;
  for (const node of nodes) {
    if (picked && node.part === picked) node.el.setAttribute("data-sel", "");
    else node.el.removeAttribute("data-sel");
  }
  document.querySelectorAll(".vj-part").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.pick === picked)));
  say(picked ? PART_TEXT[picked] ?? "" : "點零件或下面的名稱看它做什麼。");
  // reveal the layer a picked part lives in
  if (picked) {
    const node = nodes.find((n) => n.part === picked);
    if (node) {
      const i = LAYERS.indexOf(node.piece);
      const need = node.piece === "train" ? LAYERS.length : i;
      if (i >= 0 || node.piece === "train") {
        if (level > (i >= 0 ? i : 99) || level < need) setLevel(need);
      }
    }
  }
}
svg.addEventListener("click", (event) => {
  const el = event.target.closest(".it");
  if (!el || !el.dataset.part) return;
  const part = el.dataset.part;
  if (part === "start") return pushStart();
  if (part === "reset") return pushReset();
  if (part === "crown") return wind();
  pick(part);
});
// drag the rotor round its bearing
const centre = () => {
  const box = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const off = [vb.x, vb.y];
  const lift = layer.rotor.x * D.rotorLift;
  const c = [D.centre[0] + D.EZ[0] * lift, D.centre[1] + D.EZ[1] * lift];
  return [box.left + ((c[0] - off[0]) / vb.width) * box.width, box.top + ((c[1] - off[1]) / vb.height) * box.height, box.width / vb.width];
};
svg.addEventListener("pointerdown", (event) => {
  const el = event.target.closest(".it");
  if (!el || el.dataset.part !== "rotor") return;
  const [cx, cy] = centre();
  M.drag = { a: Math.atan2(event.clientY - cy, event.clientX - cx), t: performance.now() };
  M.touring = false;
  svg.setPointerCapture(event.pointerId);
  kick();
});
svg.addEventListener("pointermove", (event) => {
  if (!M.drag) return;
  const [cx, cy] = centre();
  const a = Math.atan2(event.clientY - cy, event.clientX - cx);
  let d = a - M.drag.a;
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  // screen angle and the movement's angle turn opposite ways (the iso plane is seen from above, y down)
  const deg = (-d * 180) / Math.PI;
  const now = performance.now();
  M.rotor += deg;
  M.rotorV = (deg / Math.max(1, now - M.drag.t)) * 1000 * 0.6;
  M.drag = { a, t: now };
});
const endDrag = () => {
  if (!M.drag) return;
  M.drag = null;
};
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);

document.querySelectorAll("[data-act]").forEach((b) =>
  b.addEventListener("click", () => {
    const act = b.dataset.act;
    if (act === "start") pushStart();
    else if (act === "reset") pushReset();
    else if (act === "wind") wind();
    else if (act === "down") setLevel(level + 1);
    else if (act === "up") setLevel(level - 1);
    else if (act === "mode") setMode(mode === "peel" ? "explode" : "peel");
    else if (act === "slow") {
      M.scale = M.scale < 1 ? 1 : 0.1;
      b.setAttribute("aria-pressed", String(M.scale < 1));
      kick();
    }
  }),
);
document.querySelectorAll(".vj-step").forEach((b) => b.addEventListener("click", () => setLevel(Number(b.dataset.level))));
document.querySelectorAll(".vj-part").forEach((b) => b.addEventListener("click", () => pick(b.dataset.pick)));
stage.addEventListener("keydown", (event) => {
  const key = event.key.toLowerCase();
  if (key === "s") pushStart();
  else if (key === "r") pushReset();
  else if (key === "w") wind();
  else if (key === "e" || key === "arrowdown") setLevel(level + 1);
  else if (key === "q" || key === "arrowup") setLevel(level - 1);
  else if (key === "x") setMode(mode === "peel" ? "explode" : "peel");
  else if (key === "t") document.querySelector('[data-act="slow"]').click();
  else if (key === "escape") pick(null);
  else return;
  event.preventDefault();
});
// keys work from anywhere on the page too, unless typing in a field
document.addEventListener("keydown", (event) => {
  if (event.target === stage || event.target.closest?.("input,textarea")) return;
  if (["s", "r", "w", "e", "q", "t", "x"].includes(event.key.toLowerCase())) stage.dispatchEvent(new KeyboardEvent("keydown", { key: event.key }));
});
still.addEventListener?.("change", kick);

window.__vj = { M, setMode, setLevel, pushStart, pushReset, wind };
M.amplitude = amplitudeOf(M.reserve);
setLevel(0);
tick(0);
place();
camera(0);
kick();
