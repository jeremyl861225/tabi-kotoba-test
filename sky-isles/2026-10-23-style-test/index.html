<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2c5a">
<title>浮空島 風格試作</title>
<style>
  :root {
    --glass: rgba(255, 255, 255, 0.16);
    --glass-edge: rgba(255, 255, 255, 0.32);
    --ink: #fff;
    --ink-soft: rgba(255, 255, 255, 0.78);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1d2c5a;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--ink); touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .glass {
    background: var(--glass); border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5);
    box-shadow: 0 6px 24px rgba(10, 16, 40, 0.18);
  }
  .back {
    position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
    padding: 8px 14px; border-radius: 999px; color: var(--ink); text-decoration: none;
    font-size: 14px; letter-spacing: 0.02em; text-shadow: 0 1px 6px rgba(0,0,0,.25);
  }
  .title {
    position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top));
    text-align: right; text-shadow: 0 1px 10px rgba(0,0,0,.3); pointer-events: none;
  }
  .title b { display: block; font-size: 20px; font-weight: 600; letter-spacing: 0.18em; }
  .title span { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.12em; }
  .hint {
    position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 54px);
    transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 13px;
    white-space: nowrap; transition: opacity 0.8s ease; pointer-events: none;
  }
  .hint.hide { opacity: 0; }
  .bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(16px, env(safe-area-inset-bottom)); width: min(520px, calc(100% - 32px));
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 22px;
  }
  .bar button {
    flex: none; height: 40px; min-width: 40px; border-radius: 14px; border: 1px solid var(--glass-edge);
    background: rgba(255,255,255,0.12); color: var(--ink); font: inherit; font-size: 13px;
    display: grid; place-items: center; padding: 0 10px; cursor: pointer;
  }
  .bar button.on { background: rgba(255,255,255,0.34); }
  .bar button svg { width: 16px; height: 16px; fill: currentColor; }
  .time { flex: 1; min-width: 0; }
  .lbl { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.08em; margin: 0 0 4px 2px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 99px; margin: 0;
    background: linear-gradient(90deg, #1b2452 0%, #b97d9a 22%, #ffc29a 28%, #8cc4f2 40%, #8cc4f2 62%, #ff9e6a 74%, #6a4c8c 82%, #1b2452 100%);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; }
  .fps { position: fixed; left: 8px; bottom: 4px; font-size: 10px; color: rgba(255,255,255,.45); pointer-events: none; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<a class="back glass" href="../../">← 所有測試</a>
<div class="title"><b>浮空島</b><span>風格試作 · 微縮模型</span></div>
<div class="hint glass" id="hint">點房子看它升級 · 拖曳旋轉 · 雙指縮放</div>
<div class="bar glass">
  <button id="play" class="on" aria-label="暫停時間">
    <svg viewBox="0 0 16 16" id="ic-pause"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
    <svg viewBox="0 0 16 16" id="ic-play" style="display:none"><path d="M4 2.2v11.6c0 .6.7 1 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8C4.7 1.2 4 1.6 4 2.2z"/></svg>
  </button>
  <div class="time">
    <div class="lbl" id="lbl">黃昏</div>
    <input type="range" id="tod" min="0" max="1000" value="700" aria-label="一天中的時間">
  </div>
  <button id="dof" class="on">景深</button>
</div>
<div class="fps" id="fps"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
