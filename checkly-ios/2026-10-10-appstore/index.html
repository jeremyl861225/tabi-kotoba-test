<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typeday 商店截圖</title>
<style>
:root{--bg:#F8F7F2;--card:#FFFFFF;--ink:#133E50;--ink2:#3D6070;--muted:#5A6F78;--line:#D9DDD0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#1A1C1F;--ink:#ECEEF1;--ink2:#B6BBC1;--muted:#8A9097;--line:#2C2F34;color-scheme:dark}}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang TC",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
a.back{color:var(--muted);text-decoration:none;font-size:14px}
h1{font-size:23px;line-height:1.3;margin:10px 0 6px} p{margin:0 0 12px;color:var(--ink2)}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
figure{margin:0;flex:0 0 72%;max-width:300px;scroll-snap-align:start}
img{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
</style></head><body><div class="wrap">

<h1>Typeday 商店截圖（7 張）</h1>
<p>App Store 用的 iPhone 6.9 吋截圖（1320×2868），往左滑看下一張，點圖看原尺寸。畫面裡的資料都是示範用的虛構日常，不是你手機上的資料。</p>
<div class="strip"><figure><a href="img/01-calendar.png"><img src="img/01-calendar.jpg" alt="點一天，就知道那天要做什麼" loading="lazy"></a><figcaption>01　點一天，就知道那天要做什麼</figcaption></figure><figure><a href="img/02-recurring.png"><img src="img/02-recurring.jpg" alt="每天、每週要做的事，一眼看完" loading="lazy"></a><figcaption>02　每天、每週要做的事，一眼看完</figcaption></figure><figure><a href="img/03-tasks.png"><img src="img/03-tasks.jpg" alt="大任務，拆成小步驟" loading="lazy"></a><figcaption>03　大任務，拆成小步驟</figcaption></figure><figure><a href="img/04-pending.png"><img src="img/04-pending.jpg" alt="沒勾到的，不會被忘記" loading="lazy"></a><figcaption>04　沒勾到的，不會被忘記</figcaption></figure><figure><a href="img/05-widgets.png"><img src="img/05-widgets.jpg" alt="把這一週，放在手機桌面" loading="lazy"></a><figcaption>05　把這一週，放在手機桌面</figcaption></figure><figure><a href="img/06-themes.png"><img src="img/06-themes.jpg" alt="打字機，或糖果紙" loading="lazy"></a><figcaption>06　打字機，或糖果紙</figcaption></figure><figure><a href="img/07-backup.png"><img src="img/07-backup.jpg" alt="資料只在你的手機和 iCloud" loading="lazy"></a><figcaption>07　資料只在你的手機和 iCloud</figcaption></figure></div>
<p>想改標題字、換順序、或換某一張的畫面，直接告訴我第幾張要怎麼改。</p>
</div></body></html>
