<h1>Typeday 商店截圖（中英文各 7 張）</h1>
<p>App Store 用的 iPhone 6.9 吋截圖（1320×2868），往左滑看下一張，點圖看原尺寸。示範資料重做過：每天要做的只剩一件，其他是每週兩次、每週、每兩週、每月；整個月只有四個行程。英文版是英文介面＋英文示範資料。</p>
