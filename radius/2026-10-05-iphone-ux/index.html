<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Radius iPhone 版介面試做</title>
<style>
:root{
  --paper:#fff; --paper-2:#f1f2f1; --paper-3:#e6e8e7;
  --ink:#141414; --ink-2:#5b615e; --ink-3:#9aa09d;
  --hair:rgba(20,20,20,.09); --hair-2:rgba(20,20,20,.17);
  --green:#0d6b54; --green-text:#0d6b54;
  --glass:rgba(255,255,255,.7); --glass-edge:rgba(255,255,255,.95);
  --glass-shadow:0 1px 2px rgba(10,30,20,.07),0 8px 22px rgba(10,30,20,.11);
  --sheet:rgba(248,248,248,.92); --scrim:rgba(0,0,0,.22);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#000; --paper-2:#161817; --paper-3:#242726;
  --ink:#f2f3f2; --ink-2:#a3aaa6; --ink-3:#6b726e;
  --hair:rgba(255,255,255,.1); --hair-2:rgba(255,255,255,.2);
  --green:#0f7a60; --green-text:#5cc7a2;
  --glass:rgba(52,56,54,.6); --glass-edge:rgba(255,255,255,.14);
  --glass-shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.4);
  --sheet:rgba(30,31,31,.94); --scrim:rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--green-text);outline-offset:2px}
img{display:block}

/* 試做外框：切換列與說明（不是 App 的一部分） */
.proto{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topline{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 4px) 14px 0;font-size:12.5px;color:var(--ink-3)}
.topline a{color:var(--ink-2);text-decoration:none;padding:4px 0}
.bar{padding:3px 12px 2px}
.tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--paper-2)}
.tabs button{flex:1 1 0;min-width:0;padding:6px 0;border-radius:9px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){.tabs button[aria-selected="true"]{background:var(--paper-3)}}
.caption{margin:3px 14px 8px;font-size:13px;line-height:1.45;color:var(--ink-2);min-height:2.9em}
.device{flex:1;min-height:0;display:flex;justify-content:center}
.screen{position:relative;width:100%;height:100%;overflow:hidden;overflow:clip;background:var(--paper);isolation:isolate}
@media (min-width:720px) and (min-height:720px){
  .topline,.bar,.caption{width:440px;align-self:center}
  .device{padding:6px 0 28px}
  .screen{width:390px;height:min(844px,100%);border-radius:46px;box-shadow:0 0 0 9px #161616,0 0 0 10px #3b3b3b,0 30px 70px rgba(0,0,0,.28)}
}

.scene{position:absolute;inset:0;display:none;flex-direction:column}
.scene.on{display:flex}
.demo-files{display:flex;align-items:center;gap:6px;padding:10px 14px 2px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.demo-files::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;border-radius:999px;font-size:13.5px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--hair-2)}
.chip[aria-checked="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.stage-host{position:relative;flex:1;min-height:0}

/* 舞台（水滴、放射共用） */
.stage{touch-action:none;overflow:hidden;overflow:clip}
.stage>svg,.stage>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage>canvas{z-index:1}
.spokes line{stroke:var(--hair-2);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:2 5}
.opts{position:absolute;inset:0;z-index:2;pointer-events:none}
.opt{position:absolute;left:0;top:0;pointer-events:auto;min-width:56px;padding:7px 10px 6px;border-radius:17px;text-align:center;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);box-shadow:inset 0 0 0 .5px var(--glass-edge),var(--glass-shadow);transition:background-color .16s,box-shadow .16s,color .16s,opacity .2s;will-change:transform}
.opt b{display:block;font:650 16px/1.14 var(--round);letter-spacing:-.01em;white-space:pre-line}
.opt small{display:block;margin-top:2px;font-size:11px;line-height:1.2;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt.hot{background-color:transparent;box-shadow:none;color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.opt.hot small{color:rgba(255,255,255,.85)}
.opt.dim{opacity:.45}
.fhead{position:absolute;left:16px;right:16px;top:12px;z-index:3;display:flex;align-items:center;gap:12px;pointer-events:none}
.fhead img{width:46px;height:46px;border-radius:11px;object-fit:cover;box-shadow:0 0 0 .5px var(--hair-2)}
.fhead .ph{width:46px;height:46px;border-radius:11px;box-shadow:inset 0 0 0 1.5px var(--hair-2)}
.fhead b{display:block;font-size:16px;line-height:1.25}
.fhead span{display:block;font-size:12.5px;color:var(--ink-2)}
.readout{position:absolute;left:0;right:0;z-index:3;text-align:center;pointer-events:none;padding:0 20px;transition:opacity .18s}
.readout .r1{font-size:15px;font-weight:600}
.readout .r2{font-size:13px;color:var(--ink-2);margin-top:2px}
.readout .big{font:650 36px/1.08 var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.drop-hint{position:absolute;left:0;right:0;z-index:3;margin:0;text-align:center;font-size:13px;color:var(--ink-3);pointer-events:none;transition:opacity .2s}
.ghost{position:absolute;left:0;top:0;z-index:5;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(120,120,120,.28);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),0 4px 14px rgba(0,0,0,.15);pointer-events:none;opacity:0;transition:opacity .3s}
.css-drop{position:absolute;z-index:1;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:#1d2422 center/cover;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}

/* 放射 */
.dial-svg line{stroke:var(--ink);stroke-linecap:round;transition:stroke .15s,opacity .15s}
.dial-svg line.acc,.dial-svg line.sel{stroke:var(--green)}
.dial-svg line.null{stroke:var(--ink-3);opacity:.45}
.dial-svg line.fade{opacity:.25}
.hole{position:absolute;left:0;top:0;z-index:2;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--paper-2) center/cover;box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--hair-2),0 6px 16px rgba(0,0,0,.14);transition:opacity .25s}
.lab{position:absolute;left:0;top:0;z-index:3;padding:6px 10px;border-radius:14px;font:650 14.5px/1.15 var(--round);white-space:nowrap;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 .5px var(--glass-edge),var(--glass-shadow);pointer-events:none;opacity:0;transition:background-color .15s,color .15s}
.lab i{font-style:normal;color:var(--ink-3);margin-left:1px}
.lab.sel,.lab.chosen{background:var(--green);color:#fff;box-shadow:none}
.lab.sel i,.lab.chosen i{color:rgba(255,255,255,.8)}
.dial-stage.sticky .lab{pointer-events:auto}
.trail{position:absolute;left:0;top:0;z-index:1;height:2px;width:0;background:var(--ink-3);opacity:0;transform-origin:0 50%;border-radius:1px;pointer-events:none;transition:opacity .2s}
.trail::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--ink-3)}
.dial-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);margin:0;text-align:center;font-size:13px;color:var(--ink-3);pointer-events:none;transition:opacity .2s}
.comet{position:absolute;left:0;top:0;z-index:4;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:center/cover;box-shadow:0 0 0 2px #fff,0 6px 14px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.5,0,.75,0),opacity .3s;pointer-events:none}

/* 清單 */
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(env(safe-area-inset-bottom) + 28px);touch-action:pan-y}
.list-head{display:flex;gap:12px;align-items:center;padding:4px 0 6px}
.list-head img{width:64px;height:64px;border-radius:14px;object-fit:cover;box-shadow:0 0 0 .5px var(--hair-2)}
.list-head b{display:block;font-size:17px;line-height:1.3}
.list-head span{display:block;font-size:13px;color:var(--ink-2)}
.grp h3{margin:16px 2px 8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;overflow:hidden;min-height:62px;padding:10px 11px 9px;border-radius:16px;text-align:left;background:var(--paper-2);display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.tile.big{min-height:86px}
.tile b{font:650 17px/1.15 var(--round);letter-spacing:-.01em}
.tile.big b{font-size:21px}
.tile small{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tile i{font-style:normal;font-size:11px;color:var(--ink-3)}
.tile::after{content:"";position:absolute;inset:0;z-index:0;background:var(--green);clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .45s cubic-bezier(.3,.7,.2,1)}
.tile>*{position:relative;z-index:1;transition:color .2s}
.tile.fill::after{clip-path:circle(150% at var(--x,50%) var(--y,50%))}
.tile.fill b,.tile.fill small,.tile.fill i{color:#fff}
.home-hello{margin:18px 2px 4px;font:650 26px/1.2 var(--round)}
.home-sub{margin:0 2px 8px;color:var(--ink-2);font-size:14px}
.recent{margin-top:6px;border-radius:16px;background:var(--paper-2);overflow:hidden}
.recent div{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px}
.recent div+div{box-shadow:inset 0 .5px 0 var(--hair-2)}
.recent img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.recent span{color:var(--ink-2);font-size:12.5px;margin-left:auto;white-space:nowrap}

/* 底部面板、按鈕、提示 */
.scrim{position:absolute;inset:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;transform:translateY(106%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.25,1),visibility 0s linear .42s;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-radius:28px 28px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 -8px 40px rgba(0,0,0,.14)}
.sheet.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.25,1),visibility 0s}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--hair-2);margin:0 auto 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:25px;font-size:17px;font-weight:600}
.btn.primary{background:var(--green);color:#fff}
.btn.secondary{background:var(--paper-3);color:var(--ink)}
.btn.text{height:44px;color:var(--green-text);font-weight:500}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.res-preview{display:flex;justify-content:center;align-items:center;height:168px;margin:2px 0 12px}
.res-preview img{max-width:78%;max-height:168px;border-radius:12px;box-shadow:0 0 0 .5px var(--hair-2),0 10px 24px rgba(0,0,0,.14)}
.res-preview .txt{width:100%;height:100%;padding:14px 16px;border-radius:14px;background:var(--paper);box-shadow:inset 0 0 0 .5px var(--hair-2);font-size:17px;line-height:1.6;white-space:pre-line;overflow:hidden;-webkit-user-select:text;user-select:text}
.res-name{margin:0;font-size:19px;font-weight:650;text-align:center;word-break:break-all}
.res-size{margin:3px 0 0;text-align:center;font-size:14px;color:var(--ink-2)}
.res-size b{color:var(--ink);font:650 15px var(--round);font-variant-numeric:tabular-nums;margin-right:6px}
.res-note{margin:8px 6px 0;text-align:center;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.res-where{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 14px;font-size:13px;color:var(--ink-2)}
.res-where button{color:var(--green-text);font-size:13px}
.res-actions{display:grid;gap:10px}
.folder{position:relative;width:132px;height:100px;border-radius:12px;background:linear-gradient(#7cc2e8,#4fa3d6);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.folder::before{content:"";position:absolute;left:10px;top:-10px;width:50px;height:18px;border-radius:7px 7px 0 0;background:#6cb6e0}
.folder b{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font:650 15px var(--round)}
.zip{display:flex;align-items:center;justify-content:center;width:96px;height:120px;border-radius:12px;background:var(--paper);box-shadow:0 0 0 .5px var(--hair-2),0 10px 24px rgba(0,0,0,.12);font:700 17px var(--round);color:var(--ink-2);background-image:repeating-linear-gradient(var(--ink-3) 0 6px,transparent 6px 12px);background-size:8px 54px;background-repeat:no-repeat;background-position:center 10px}
.pk{max-height:min(60vh,520px);overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px 12px;padding:0 4px 2px;touch-action:pan-y}
.pk h4{margin:14px 2px 8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pk h4:first-child{margin-top:0}
.tile.on{box-shadow:inset 0 0 0 2px var(--green)}
.pkrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;text-align:left}
.pkrow+.pkrow{margin-top:2px}
.pkrow:active{background:var(--paper-3)}
.pkrow img{width:40px;height:40px;border-radius:9px;object-fit:cover}
.pkrow b{display:block;font-size:16px;font-weight:600}
.pkrow small{display:block;font-size:12.5px;color:var(--ink-2)}
.pkrow .ok{margin-left:auto;font-style:normal;color:var(--green-text);font-weight:700}
.seg2{display:flex;gap:2px;margin:-2px auto 10px;padding:3px;border-radius:12px;background:var(--paper-3);width:max-content}
.seg2 button{padding:5px 15px;border-radius:9px;font-size:14px;color:var(--ink-2)}
.seg2 button[aria-checked="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 造句 */
.sent-stage{display:flex;flex-direction:column}
.sent{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 20px 8px;display:flex;flex-direction:column;align-items:flex-start;touch-action:pan-y}
.sent .w{margin:14px 4px 6px;font-size:15px;color:var(--ink-2)}
.sent .w:first-child{margin-top:4px}
.sent .soft{color:var(--ink-3);font-size:13.5px}
.tok{display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:9px 14px 9px 10px;border-radius:18px;background:var(--paper-2);font:650 26px/1.2 var(--round);letter-spacing:-.01em;text-align:left;box-shadow:inset 0 0 0 .5px var(--hair)}
.tok .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tok img,.tok .ph{flex:0 0 auto;width:40px;height:40px;border-radius:10px;object-fit:cover}
.tok .ph{box-shadow:inset 0 0 0 1.5px var(--hair-2)}
.tok .chev{flex:0 0 auto;font-size:14px;color:var(--ink-3)}
.tok.fmt{padding:9px 18px;background:var(--green);color:#fff;box-shadow:none}
.tok.fmt .chev{color:rgba(255,255,255,.75)}
.tok.small{font-size:21px;padding:7px 14px}
.sent-foot{flex:0 0 auto;padding:10px 16px calc(env(safe-area-inset-bottom) + 14px)}
.sent-est{margin:0 4px 10px;min-height:1.6em;font-size:14px;color:var(--ink-2)}
.sent-est b{font:650 18px var(--round);color:var(--ink);font-variant-numeric:tabular-nums}
.go{position:relative;overflow:hidden}
.go span{position:relative;z-index:1}
.go::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.28);transform:translateX(-101%);transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.go.fill::after{transform:none}
.go:disabled{opacity:.35}
/* 功能對照 */
.tag{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:7px;font-size:11.5px;font-weight:600;line-height:1.6;vertical-align:1px;white-space:nowrap}
.tag.g{background:#e3f1ec;color:#0b5c48}
.tag.o{background:#fbecd9;color:#7d4309}
.tag.p{background:#ece8f7;color:#47378a}
.tag.n{background:var(--paper-2);color:var(--ink-2)}
@media (prefers-color-scheme:dark){.tag.g{background:#123a2f;color:#7fd6b4}.tag.o{background:#3d2a12;color:#f0b877}.tag.p{background:#2a2442;color:#bcb0f0}}
.legend{display:grid;gap:6px;margin:8px 0 6px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.mx h3{margin:18px 0 2px;font-size:16px}
.mx h3 small{font-weight:400;font-size:12.5px;color:var(--ink-2);margin-left:6px}
.mx ul{list-style:none;padding:0;margin:0}
.mx li{margin:0;padding:7px 0;font-size:14.5px;line-height:1.55;box-shadow:inset 0 -.5px 0 var(--hair)}
.choice{margin:10px 0;padding:12px 14px;border-radius:14px;background:var(--paper-2)}
.choice b{display:block;margin-bottom:2px}
.choice p{margin:0;font-size:14px;line-height:1.6}
.sheet h3{margin:0 2px 10px;font-size:17px;text-align:center}
.toast{position:absolute;top:12px;left:50%;z-index:60;transform:translate(-50%,-160%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.25,1),visibility 0s linear .38s;max-width:88%;padding:10px 16px;border-radius:22px;background:var(--sheet);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 6px 24px rgba(0,0,0,.16);font-size:14px;line-height:1.4;text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .38s cubic-bezier(.2,.9,.25,1),visibility 0s}
.capsule{position:absolute;top:10px;left:50%;z-index:59;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:24px;background:#000;color:#fff;font-size:13.5px;transform:translate(-50%,-160%) scale(.9);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.25,1),visibility 0s linear .45s;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.capsule.on{transform:translate(-50%,0) scale(1);visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.25,1),visibility 0s}
.capsule svg.ring{width:22px;height:22px;transform:rotate(-90deg)}
.capsule svg.ring circle{fill:none;stroke-width:3}
.capsule em{font-style:normal;color:rgba(255,255,255,.6);font-size:12px}

/* 分享進來 */
.photos{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px}
.ph-lib{font-size:16px;color:#5aa9ff;white-space:nowrap}
.ph-title{text-align:center;line-height:1.2}
.ph-title b{display:block;font-size:15px}
.ph-title span{font-size:12px;color:rgba(255,255,255,.6)}
.seg{display:flex;padding:2px;border-radius:9px;background:rgba(255,255,255,.16)}
.seg button{padding:3px 9px;border-radius:7px;font-size:12.5px;color:rgba(255,255,255,.8)}
.seg button[aria-checked="true"]{background:rgba(255,255,255,.9);color:#000;font-weight:600}
.ph-view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph-one{width:100%;height:auto}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;width:100%;align-self:flex-start;margin-top:12px}
.ph-grid div{position:relative;aspect-ratio:1;background:center/cover}
.ph-grid div::after{content:"✓";position:absolute;right:5px;bottom:5px;width:20px;height:20px;border-radius:50%;background:#0a84ff;color:#fff;font-size:12px;line-height:20px;text-align:center;box-shadow:0 0 0 1.5px #fff}
.ph-bar{display:flex;justify-content:space-around;align-items:center;padding:10px 6px calc(env(safe-area-inset-bottom) + 12px)}
.ph-bar>*{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#5aa9ff}
.ph-bar svg{width:25px;height:25px}
.coach{position:absolute;z-index:5;padding:7px 12px;border-radius:12px;background:#fff;color:#000;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap}
.coach::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(90,169,255,.7)}70%{box-shadow:0 0 0 14px rgba(90,169,255,0)}100%{box-shadow:0 0 0 0 rgba(90,169,255,0)}}
.ios{background:var(--sheet);padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
.ios-head{display:flex;align-items:center;gap:10px;padding:0 0 12px;box-shadow:inset 0 -.5px 0 var(--hair-2)}
.ios-head img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.ios-head b{display:block;font-size:15px}
.ios-head span{font-size:13px;color:var(--green-text)}
.ios-x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--paper-3);font-size:13px;color:var(--ink-2)}
.ios-apps{display:flex;gap:6px;padding:14px 0;overflow-x:auto;scrollbar-width:none}
.app{flex:0 0 66px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink)}
.app i{display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:14px;font-style:normal;color:#fff}
.app i svg{width:58px;height:58px}
.ic-airdrop{background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.ic-msg{background:linear-gradient(#5ff777,#1bd741)}
.ic-mail{background:linear-gradient(#1e9bff,#0f6cf0)}
.ic-chat{background:#06c755}
.app.rx i{border-radius:14px;overflow:hidden}
.app.rx.pulse i{animation:pulse 1.6s ease-out infinite}
.ios-acts{border-radius:14px;background:var(--paper);overflow:hidden}
.ios-acts div{padding:12px 14px;font-size:15px}
.ios-acts div+div{box-shadow:inset 0 .5px 0 var(--hair)}
.rx-sheet{top:7%;display:flex;flex-direction:column;padding-left:0;padding-right:0;padding-bottom:0;background:var(--paper)}
.rx-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px 4px}
.rx-head button{color:var(--green-text);font-size:16px;width:60px;text-align:left}
.rx-head b{font-size:16px}
.rx-head span{width:60px}

.pdf-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;flex:0 0 auto}

.pdf-top button:last-child{text-align:right;font-weight:600}

.pdf-title b{display:block;font-size:16px}
.pdf-title span{font-size:12.5px;color:var(--ink-2)}

.pg{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;touch-action:pan-y}
.pg .paper{position:relative;width:100%;aspect-ratio:210/297;display:flex;align-items:center;justify-content:center}

.pg .n{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.pg.sel .chk{background:var(--green);color:#fff;box-shadow:0 0 0 2px var(--paper)}
.pg.sel canvas{box-shadow:0 0 0 2.5px var(--green)}
.pg.lift{z-index:5}
.pg.lift canvas{box-shadow:0 0 0 .5px var(--hair-2),0 16px 34px rgba(0,0,0,.28)}
.pg.gone{transition:transform .25s,opacity .25s;transform:scale(.6);opacity:0}
.pdf-bar{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:6;display:flex;align-items:center;justify-content:space-around;gap:2px;padding:8px 6px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:inset 0 0 0 .5px var(--glass-edge),var(--glass-shadow)}
.pdf-bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:11.5px;color:var(--ink)}
.pdf-bar button svg{width:22px;height:22px}
.pdf-bar button:disabled{opacity:.3}
.pdf-bar .warn{color:#d0342c}
.markup{position:absolute;inset:0;z-index:20;background:var(--paper-2);display:flex;flex-direction:column}
.mk-page{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 18px}
.mk-wrap{position:relative;box-shadow:0 0 0 .5px var(--hair-2),0 10px 30px rgba(0,0,0,.15)}
.mk-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.mk-ink{touch-action:none}
.mk-tools{display:flex;justify-content:space-around;margin:0 12px calc(env(safe-area-inset-bottom) + 12px);padding:8px 6px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px var(--glass-edge),var(--glass-shadow)}
.mk-tools button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;font-size:11.5px;border-radius:14px}
.mk-tools button[aria-pressed="true"]{background:var(--paper)}
.mk-tools .dot{width:22px;height:22px;border-radius:50%}

/* 說明 */
.notes{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px calc(env(safe-area-inset-bottom) + 40px);-webkit-user-select:text;user-select:text;touch-action:pan-y}

.notes h2:first-of-type{margin-top:6px}
.notes p,.notes li{font-size:15px;line-height:1.65;color:var(--ink)}
.notes p{margin:0 0 8px}
.notes ul{margin:0 0 8px;padding-left:1.2em}
.notes li{margin:3px 0}
.notes .icon-row{display:flex;align-items:center;gap:14px;margin:4px 0 6px}
.notes .icon-row p{margin:0;color:var(--ink-2);font-size:14px}
.notes .muted{color:var(--ink-2)}

/* ---------- 示範用的圖（全部用程式畫，沒有外部圖檔） ---------- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

  g.fillStyle=hsl(35,30,72,.85);g.beginPath();g.moveTo(w*.38,h);g.quadraticCurveTo(w*.49,h*.86,w*.55,h*.74);g.lineTo(w*.59,h*.74);g.quadraticCurveTo(w*.61,h*.87,w*.72,h);g.closePath();g.fill();
  if(v===0){const bx=w*.64,by=h*.42,bw=w*.28,bh=h*.17;
    g.fillStyle='#5a3d26';g.fillRect(bx+bw*.46,by+bh*.8,bw*.08,h*.38);
    g.fillStyle='#6e4a2c';rr(g,bx,by,bw,bh,h*.015);g.fill();
    g.fillStyle='#f4ead6';g.textAlign='center';g.textBaseline='middle';
    g.font=`700 ${Math.round(bh*.33)}px -apple-system,"PingFang TC","Noto Sans TC",sans-serif`;g.fillText('山頂步道',bx+bw/2,by+bh*.36);
    g.font=`600 ${Math.round(bh*.24)}px -apple-system,sans-serif`;g.fillText('1.2 km',bx+bw/2,by+bh*.72)}

function paintPage(w,h,o={}){
  const c=cv(w,h),g=c.getContext('2d'),r=rng(o.seed||1),m=w*.1;
  g.fillStyle=o.kind==='scan'?'#efede6':(o.tint||'#fff');g.fillRect(0,0,w,h);
  let y=m;
  if(o.title){g.fillStyle=o.kind==='doc'?'#1f4f45':'#1d1d1d';g.font=`700 ${w*.075}px -apple-system,"PingFang TC","Noto Sans TC",sans-serif`;g.textBaseline='top';g.textAlign='left';g.fillText(o.title,m,y);y+=w*.12;g.fillStyle='#d4d8d6';g.fillRect(m,y,w-2*m,Math.max(1,w*.006));y+=w*.05}

    this.bar.innerHTML=this.sel.size?B('rot','旋轉')+B('dup','複製')+B('mark','標註',this.sel.size!==1)+B('out','拆出')+B('del','刪除',false,'warn')
      :B('add','加入 PDF')+B('scan','掃描')+B('all','全選',!this.pages.length)},
  act(a){const ids=[...this.sel];
    if(a==='all'){this.pages.forEach(p=>this.sel.add(p.id));this.update();return}
    if(a==='add'){const n=this.pages.length;for(let i=1;i<=2;i++)this.pages.push({id:this.nextId++,src:'other',n:i,rot:0,strokes:[]});this.render();toast('從「檔案」加入「附件.pdf」2 頁');setTimeout(()=>this.grid.scrollTo({top:this.grid.scrollHeight,behavior:'smooth'}),50);return}
    if(a==='scan'){this.pages.push({id:this.nextId++,src:'scan',n:this.nextId,rot:0,strokes:[]});this.render();toast('用相機掃描的頁面已加在最後');setTimeout(()=>this.grid.scrollTo({top:this.grid.scrollHeight,behavior:'smooth'}),50);return}
    if(a==='rot'){ids.forEach(id=>{const p=this.byId(id);p.rot+=90});this.redraw(ids);return}
    if(a==='dup'){ids.forEach(id=>{const i=this.pages.findIndex(p=>p.id===id),p=this.pages[i];this.pages.splice(i+1,0,{...p,id:this.nextId++,strokes:p.strokes.slice()})});this.sel.clear();this.render();toast(`已複製 ${ids.length} 頁`);return}
    if(a==='del'){ids.forEach(id=>{const d=this.grid.querySelector(`.pg[data-id="${id}"]`);d&&d.classList.add('gone')});
      setTimeout(()=>{this.pages=this.pages.filter(p=>!this.sel.has(p.id));this.sel.clear();this.render()},240);return}
    if(a==='out'){const nums=this.pages.map((p,i)=>this.sel.has(p.id)?i+1:0).filter(Boolean);toast(`已把第 ${nums.join('、')} 頁存成新的 PDF`);this.sel.clear();this.update();return}
    if(a==='mark'){this.openMarkup(this.byId(ids[0]))}},
  redraw(ids){ids.forEach(id=>{const d=this.grid.querySelector(`.pg[data-id="${id}"]`);if(d)this.draw(this.byId(id),d.querySelector('canvas'),Math.round(d.querySelector('.paper').clientWidth))})},
  bindGrid(){const g=this.grid;let st=null,timer=0,lifted=null;
    const pos=e=>{const r=g.getBoundingClientRect();return{x:e.clientX-r.left+g.scrollLeft,y:e.clientY-r.top+g.scrollTop}};
    g.addEventListener('touchmove',e=>{if(lifted)e.preventDefault()},{passive:false});
    g.addEventListener('contextmenu',e=>e.preventDefault());
    g.addEventListener('pointerdown',e=>{const d=e.target.closest('.pg');if(!d)return;const p=pos(e);st={d,p,moved:false,id:e.pointerId};
      timer=setTimeout(()=>{if(!st||st.moved)return;lifted={d,gx:p.x-d.offsetLeft,gy:p.y-d.offsetTop};d.classList.add('lift');haptic();try{g.setPointerCapture(st.id)}catch(_){};this.dragMove(p,lifted)},330)});
    g.addEventListener('pointermove',e=>{if(!st)return;const p=pos(e);if(!lifted){if(Math.hypot(p.x-st.p.x,p.y-st.p.y)>8){st.moved=true;clearTimeout(timer)}return}this.dragMove(p,lifted);
      const r=g.getBoundingClientRect();if(e.clientY>r.bottom-70)g.scrollTop+=8;else if(e.clientY<r.top+50)g.scrollTop-=8});
    const end=e=>{clearTimeout(timer);if(!st)return;
      if(lifted){const d=lifted.d;d.style.transition='transform .22s cubic-bezier(.2,.8,.2,1)';d.style.transform='';d.classList.remove('lift');setTimeout(()=>{d.style.transition=''},240);lifted=null;this.update()}
      else if(!st.moved&&e.type==='pointerup'){const id=+st.d.dataset.id;this.sel.has(id)?this.sel.delete(id):this.sel.add(id);this.update()}
      st=null};
    g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end)},
  dragMove(p,L){const d=L.d;d.style.transform=`translate(${p.x-L.gx-d.offsetLeft}px,${p.y-L.gy-d.offsetTop}px) scale(1.06)`;
    const tiles=$$('.pg',this.grid);const from=tiles.indexOf(d);let to=-1;
    tiles.forEach((t,i)=>{if(t===d)return;if(p.x>=t.offsetLeft&&p.x<=t.offsetLeft+t.offsetWidth&&p.y>=t.offsetTop&&p.y<=t.offsetTop+t.offsetHeight)to=i});
    if(to<0||to===from)return;
    const before=new Map(tiles.map(t=>[t,{x:t.offsetLeft,y:t.offsetTop}]));
    const [moved]=this.pages.splice(from,1);this.pages.splice(to,0,moved);
    if(to>from)this.grid.insertBefore(d,tiles[to].nextSibling);else this.grid.insertBefore(d,tiles[to]);
    tiles.forEach(t=>{if(t===d)return;const b=before.get(t),dx=b.x-t.offsetLeft,dy=b.y-t.offsetTop;if(!dx&&!dy)return;
      t.style.transition='none';t.style.transform=`translate(${dx}px,${dy}px)`;requestAnimationFrame(()=>{t.style.transition='transform .25s cubic-bezier(.2,.8,.2,1)';t.style.transform=''})});
    d.style.transform=`translate(${p.x-L.gx-d.offsetLeft}px,${p.y-L.gy-d.offsetTop}px) scale(1.06)`;
    $$('.pg .n',this.grid).forEach((n,i)=>{n.textContent=i+1})},
  /* 標註：筆、螢光筆、簽名、復原 */
  bindMarkup(){const ink=$('#mk-ink');let tool='pen',cur=null;
    $('#mk-tools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.t==='undo'){this.mk.strokes.pop();this.paintInk();return}
      tool=b.dataset.t;$$('#mk-tools button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(tool==='sign')toast('點頁面上要簽名的位置')});
    const P=e=>{const r=ink.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
    ink.addEventListener('pointerdown',e=>{e.preventDefault();const q=P(e);
      if(tool==='sign'){const pts=[];for(let i=0;i<=80;i++){const t=i/80;pts.push([q[0]-.12+t*.26+.018*Math.sin(t*26),q[1]+.022*Math.sin(t*15)*(1-.4*t)-.01*t])}this.mk.strokes.push({t:'sign',pts});this.paintInk();haptic();return}
      try{ink.setPointerCapture(e.pointerId)}catch(_){}cur={t:tool,pts:[q]};this.mk.strokes.push(cur);this.paintInk()});
    ink.addEventListener('pointermove',e=>{if(!cur)return;cur.pts.push(P(e));this.paintInk()});
    const stop=()=>{cur=null};ink.addEventListener('pointerup',stop);ink.addEventListener('pointercancel',stop);
    $('#mk-cancel').addEventListener('click',()=>{this.mk.strokes.length=this.mk.keep;$('#markup').hidden=true});
    $('#mk-done').addEventListener('click',()=>{$('#markup').hidden=true;this.redraw([this.mk.id]);if(this.mk.strokes.length>this.mk.keep)toast('標註已加上；存檔時會一起寫進 PDF')})},
  openMarkup(p){this.mk=p;p.keep=p.strokes.length;this.mk.keep=p.strokes.length;$('#markup').hidden=false;
    $('#mk-page').textContent=`第 ${this.pages.indexOf(p)+1} 頁`;
    requestAnimationFrame(()=>{const box=$('.mk-page'),wrap=$('#mk-wrap'),maxW=box.clientWidth-36,maxH=box.clientHeight-16;
      let w=maxW,h=w*297/210;if(h>maxH){h=maxH;w=h*210/297}wrap.style.width=w+'px';wrap.style.height=h+'px';
      for(const c of[$('#mk-bg'),$('#mk-ink')]){c.width=Math.round(w*2);c.height=Math.round(h*2)}
      const g=$('#mk-bg').getContext('2d');g.drawImage(this.pageArt(p),0,0,w*2,h*2);this.paintInk()})},
  paintInk(){const c=$('#mk-ink'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);this.drawStrokes(g,this.mk,c.width,c.height,0,0)}};

/* ---------- 說明＋功能對照 ---------- */
function initNotes(){const n=$('#notes');if(n.dataset.ready)return;n.dataset.ready=1;
  const T={g:'<span class="tag g">直接搬</span>',o:'<span class="tag o">內附引擎</span>',p:'<span class="tag p">換做法</span>',n:'<span class="tag n">新增</span>'};
  n.innerHTML=`<div class="icon-row">${radiusIcon(60)}<p>Radius for iPhone<br>介面試做，2026 年 10 月 5 日</p></div>
  <h2>四種選格式的方式</h2>
  <ul><li><b>水滴</b>：最接近 Mac 版。水滴在拇指搆得到的下方，格式排成一道弧，按住往上拉；水滴裡看得到檔案。手會擋住下半部，所以大小寫在最上面。</li>
  <li><b>放射</b>：用圖示的 12 條線。按住任何地方往一個方向滑，方向固定，熟了不用看；右下那條綠線是這類檔案最常用的格式。</li>
  <li><b>清單</b>：點一下就轉，所有格式都攤開。</li>
  <li><b>造句</b>：「把〔檔案〕轉成〔格式〕存到〔哪裡〕」，每個詞點了就能換；品質、解析度、壓縮格式這類選項也在這裡。</li></ul>
  <p class="muted">四種都能直接點選，不一定要拖。可以只留一種，也可以讓使用者在設定裡挑。</p>
  <h2>檔案從哪裡進來</h2>
  <ul><li><b>分享選單</b>：在照片、檔案、LINE、郵件按分享 › Radius，原地轉好，不用切 App。這是 iPhone 上最主要的入口（看「分享」）。第一次要在分享選單的「更多」裡把 Radius 拉到前面。</li>
  <li><b>打開 Radius</b>：從照片、檔案挑，用相機掃描紙本，或貼上剪貼簿。</li>
  <li><b>捷徑</b>：例如把「這張轉成 PDF」設成一個捷徑或動作按鈕。</li></ul>
  <h2>轉好以後</h2>
  <p>預設存到 Radius 資料夾，另外可以分享、存到照片、存到檔案。資料夾放在 iCloud 雲碟的話，Mac 上馬上看得到；這要付費的開發者帳號，免費帳號先放在「我的 iPhone › Radius」。</p>
  <h2>功能對照：Mac 版有的，iPhone 版全部都有</h2>
  <div class="legend"><span>${T.g}iPhone 系統本來就有，Mac 版的程式幾乎直接搬</span><span>${T.o}Mac 版是叫外部程式來做，iPhone 不准，要把引擎編進 App</span><span>${T.p}Mac 版用的是 Mac 才有的功能，iPhone 要換做法</span></div>
  <div class="mx">
  <h3>圖片<small>JPG PNG HEIC TIFF GIF BMP WebP AVIF RAW SVG</small></h3><ul>
   <li>${T.g}轉 JPG、PNG、HEIC、TIFF、GIF、BMP、PDF</li>
   <li>${T.g}做成 Word、簡報；多張合併成一份 PDF 或簡報</li>
   <li>${T.g}辨識文字，存成 TXT 或 Word</li>
   <li>${T.g}清除隱私（JPG、PNG）</li>
   <li>${T.g}GIF 動圖轉 MP4、MOV</li>
   <li>${T.o}轉 WebP；GIF 動圖轉 MKV、WebM、AVI、WMV</li>
   <li>${T.p}讀 SVG：改用 iPhone 的網頁引擎畫出來</li></ul>
  <h3>影片<small>MP4 MOV MKV WebM AVI WMV FLV MPEG 3GP m3u8</small></h3><ul>
   <li>${T.g}MP4、MOV、3GP 之間互轉；轉 GIF；抽出 M4A、WAV；清除隱私</li>
   <li>${T.o}讀寫 MKV、WebM、AVI、WMV、FLV、MPEG；抽出 MP3；m3u8 串流</li>
   <li>${T.n}轉得久的可以切到別的 App，進度顯示在動態島與鎖定畫面</li></ul>
  <h3>聲音<small>MP3 M4A WAV FLAC Opus OGG AIFF WMA</small></h3><ul>
   <li>${T.g}轉 M4A、WAV、AIFF；清除隱私</li>
   <li>${T.o}轉 MP3、FLAC、Opus、OGG、WMA</li></ul>
  <h3>PDF</h3><ul>
   <li>${T.g}每頁轉 PNG、JPG；轉 TXT、Word、簡報；拆分、整理、合併、清除隱私</li>
   <li>${T.p}縮小：Mac 用的「縮小檔案」濾鏡 iPhone 沒有，要自己把頁面裡的圖重新壓縮</li>
   <li>${T.n}標註、螢光筆、簽名</li></ul>
  <h3>文字與字幕<small>TXT SRT VTT</small></h3><ul>
   <li>${T.g}TXT 轉 PDF、Word、PNG、JPG、SRT、VTT；字幕互轉、轉純文字；Big5、簡體、日韓舊編碼自動判斷</li></ul>
  <h3>Word 與簡報<small>doc docx rtf odt ppt pptx odp</small></h3><ul>
   <li>${T.g}Word 轉 TXT（docx、odt、rtf）</li>
   <li>${T.p}Word、簡報轉 PDF；簡報轉 PNG、JPG；和其他檔案合併成 PDF；舊版 .doc 轉 TXT——要選一條路，見下面</li></ul>
  <h3>壓縮檔與資料夾<small>ZIP 7z RAR tar.gz</small></h3><ul>
   <li>${T.o}解壓縮 ZIP、7z、RAR、tar 系列；壓縮成 ZIP、7z、tar.gz</li>
   <li>有密碼的壓縮檔：和 Mac 版一樣，會先說明不支援</li></ul>
  <h3>其他</h3><ul>
   <li>${T.g}轉出後大小預估</li>
   <li>${T.p}輸出位置：iPhone 沒有「存在原檔旁邊」，改成 Radius 資料夾、照片、檔案、分享</li>
   <li>${T.p}互動教學：改成手機版</li></ul></div>
  <h2>Word、簡報要選一條路</h2>
  <div class="choice"><b>A　用 iPhone 內建的 Office 預覽排版</b><p>App 小、做得快。.docx、.pptx 大致可以，但已知頁首圖片、浮水印會掉，舊版 .doc 可能打不開。</p></div>
  <div class="choice"><b>B　把 LibreOffice 編進 App</b><p>和 Mac 版同一個引擎，每種格式都轉得動、結果和 Mac 版一樣。App 會多 300 MB 左右，建置最費工；已經有 App（Collabora Office）這樣做並上架。</p></div>
  <p>要「功能一個都不少」，建議走 B；開發途中可以先用 A 讓你試用。</p>
  <h2>要做出來需要的</h2>
  <ul><li>這台 Mac 要升級到 macOS 26.6 以上（或最新的 27），再裝 Xcode 27（免費）；現在的 14.5 只能裝到舊的 Xcode 16.2。</li>
  <li>免費 Apple ID：可以裝到你自己的 iPhone，但每 7 天要重裝一次，也不能用 iCloud 資料夾。</li>
  <li>付費開發者帳號（每年 99 美元）：TestFlight、上架、iCloud 資料夾都可以，裝一次用一年。</li></ul>`}

/* ---------- 場景切換 ---------- */
const CAPTIONS={
  drop:'按住水滴往上拉，碰到格式會連起來，放開就轉；直接點格式也可以。上面可以換別種檔案試。',
  dial:'在畫面任何地方按住，往一個方向滑，放開就轉。每個格式的方向固定，熟了不用看；點一下則會攤開讓你點。',
  list:'點一下就轉。所有格式都攤開，最好找；換成「首頁」就是打開 App 的樣子。',
  sent:'不用拖：「把〔檔案〕轉成〔格式〕存到〔哪裡〕」，每個詞點了就能換，選項也最完整。',
  share:'iPhone 上檔案多半在別的 App 裡：在照片按分享、選 Radius，原地就轉好。右上可以切換選 1 張或 12 張。',
  pdf:'點頁面選取，再用下面的工具；長按可以拖曳排序。選一頁按「標註」可以手寫、畫重點、簽名。',
  notes:'整體構想，以及 Mac 版每一項功能在 iPhone 上怎麼做。'};
let cur=null;
function show(name){if(!CAPTIONS[name])name='drop';if(cur===name)return;
  if(Result.onClose||$('#result').classList.contains('open'))Result.close();
  cur=name;$$('.scene').forEach(s=>s.classList.toggle('on',s.id==='s-'+name));
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.s===name)));
  $('#caption').textContent=CAPTIONS[name];
  try{history.replaceState(null,'','#'+name)}catch(_){}
  Drop&&Drop.stop();Dial&&Dial.stop();Share.stage&&Share.stage.stop();
  if($('#more').classList.contains('open'))Picker.close();
  if(name==='drop'){initDrop();Drop.start();requestAnimationFrame(()=>Drop.layout());if(!show.demoed){show.demoed=true;setTimeout(()=>{if(cur==='drop'&&Drop.key==='photo')Drop.demo('jpg')},1300)}}
  if(name==='dial'){initDial();Dial.start();requestAnimationFrame(()=>Dial.layout())}
  if(name==='list')initList();
  if(name==='sent')initSent();
  if(name==='share'){Share.init();requestAnimationFrame(()=>Share.placeCoach());if($('#rx-sheet').classList.contains('open'))Share.stage.start()}
  if(name==='pdf')PDFX.init();
  if(name==='notes')initNotes()}
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.s)});
addEventListener('resize',()=>{if(cur==='share')Share.placeCoach()});
show((location.hash||'').slice(1)||'drop');
</script>
