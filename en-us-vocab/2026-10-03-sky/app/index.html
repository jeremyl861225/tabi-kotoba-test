<script>
  // 使用者在設定裡指定深淺色時，第一次畫面就套用（開場畫面才不會先閃另一種底色）
  try { var t = (JSON.parse(localStorage.getItem('street-talk-test/v1') || '{}').settings || {}).theme; if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  // 開場（js/splash.js）：開場期間先藏住 App 本體，開場結束後才淡入；減少動態效果時沒有開場
  if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.classList.add('splashing');

<!--
THESIS: 旅ことば系列的「暮色玻璃」英文版：背景是慢慢起伏的天空漸層，所有內容浮在液態玻璃上；主角是美式英文（襯線字）與它下面的 KK 音標。
OWN-WORLD: 照搬韓文版 여행말 v8（著色器天空、玻璃面板、分頁列玻璃珠、下一站玻璃大格、站號章、可拖曳的字卡）。天空色組與家族色暫定（美國生活色），待使用者選。
STORY: 打開時天空亮起、玻璃上浮出「旅」與「Street Talk」；看到下一站與三條線；字卡用手指拖著換；在美國現場查字、聽發音。
FIRST VIEWPORT: 開場（約 1.7 秒、點一下跳過）；之後左上「Street Talk」與已學字數；下一站玻璃大格；主題家族 3×3；三條可收合的線。
FORM: 外觀與互動同旅ことば／여행말；英文版的差異：KK 音標行、字母方塊拼字、看英文選重音正確的 KK、沒有標注（ruby）。
FINISH: 2026-10-03 搬殼；未做：天空色組、圖示、英文字型打包（KK 的 IPA 字形）、KK 音標課程、離線字典資料。
-->

<div id="skysw" style="position:fixed;top:8px;right:8px;z-index:99;display:flex;gap:4px;font:600 13px system-ui;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.15)"><button data-sky="A" style="border:0;border-radius:999px;padding:6px 10px;background:transparent">A</button><button data-sky="B" style="border:0;border-radius:999px;padding:6px 10px;background:transparent">B</button><button data-sky="C" style="border:0;border-radius:999px;padding:6px 10px;background:transparent">C</button><button data-sky="D" style="border:0;border-radius:999px;padding:6px 10px;background:transparent">D</button><button data-mode="light" style="border:0;border-radius:999px;padding:6px 8px;background:transparent">淺</button><button data-mode="dark" style="border:0;border-radius:999px;padding:6px 8px;background:transparent">深</button></div>
<script type="module">
import { PALETTES, setSkyMode } from './js/sky.js';
const SK = {"A": {"name": "夕陽公路", "desc": "淺色 Sunset（橘、天藍、金：加州夕陽、66 號公路）／深色 Nighty night（灰紫夜色）", "day": ["#ff7a33", "#33a0ff", "#ffc53d"], "dusk": ["#606080", "#8d7dca", "#212121"], "bd": 1.0, "bk": 0.8, "ink": "#1d2238", "base": "#f2b98f", "baseD": "#2a2840"}, "B": {"name": "薄荷", "desc": "淺色 Mint（薄荷綠、淺青、白）／深色 Pensive（藍、紫）", "day": ["#94ffd1", "#6bf5ff", "#ffffff"], "dusk": ["#809bd6", "#910aff", "#af38ff"], "bd": 0.98, "bk": 0.62, "ink": "#10343a", "base": "#c4f5ea", "baseD": "#2a1c55"}, "C": {"name": "星際", "desc": "淺色 Interstella（青綠、橘、淡藍）／深色 Nighty night（灰紫夜色）", "day": ["#73bfc4", "#ff810a", "#8da0ce"], "dusk": ["#606080", "#8d7dca", "#212121"], "bd": 1.0, "bk": 0.8, "ink": "#1b2a36", "base": "#cbbfa8", "baseD": "#2a2840"}, "D": {"name": "棉花糖", "desc": "淺色 Cotton Candy（極淡的粉、白、淺藍）／深色 Pensive（藍、紫）", "day": ["#ebedff", "#f3f2f8", "#dbf8ff"], "dusk": ["#809bd6", "#910aff", "#af38ff"], "bd": 0.96, "bk": 0.62, "ink": "#262a48", "base": "#ecefff", "baseD": "#2a1c55"}};
const qs = new URLSearchParams(location.search);
let cur = qs.get('sky') || 'A';
function apply() {
  const o = SK[cur];
  PALETTES.day.c = o.day; PALETTES.day.b = o.bd; PALETTES.dusk.c = o.dusk; PALETTES.dusk.b = o.bk;
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  if (!dark) { root.style.setProperty('--ink', o.ink); root.style.setProperty('--cta', o.ink); root.style.setProperty('--focus', o.ink); }
  else { root.style.removeProperty('--ink'); root.style.removeProperty('--cta'); root.style.removeProperty('--focus'); }
  root.style.setProperty('--sky-base', dark ? o.baseD : o.base);
  setSkyMode(dark);
  document.querySelectorAll('#skysw [data-sky]').forEach((b) => { b.style.background = b.dataset.sky === cur ? '#222' : 'transparent'; b.style.color = b.dataset.sky === cur ? '#fff' : '#222'; });
}
document.getElementById('skysw').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sky) { cur = b.dataset.sky; }
  if (b.dataset.mode) { document.documentElement.setAttribute('data-theme', b.dataset.mode); }
  apply();
});
if (qs.get('mode')) document.documentElement.setAttribute('data-theme', qs.get('mode'));
setTimeout(apply, 50); setTimeout(apply, 2200);
</script>
