function chips(){famEl.innerHTML='';chip(famEl,'全部 '+D.length,fam==='all',()=>{fam='all';chips();render();});
 FAM.forEach(f=>{const n=f.themes.reduce((a,t)=>a+(CNT[t]||0),0);chip(famEl,f.name+' '+n,fam===f.id,()=>{fam=f.id;chips();render();});});
 tierEl.innerHTML='';[0,1,2,3].forEach(t=>chip(tierEl,t?TN[t]+'線':'三條線都看',tier===t,()=>{tier=t;chips();render();}));}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){const ql=q.trim().toLowerCase();const groups={};
 D.forEach(r=>{const [w,s,th,t,n]=r;if(fam!=='all'&&TH[th][1]!==fam)return;if(tier&&t!==tier)return;
  if(ql&&!(w.toLowerCase().includes(ql)||s.includes(q.trim())))return;(groups[th]=groups[th]||[]).push(r);});
 const order=FAM.flatMap(f=>f.themes);let h='';
 order.forEach(th=>{const g=groups[th];if(!g)return;h+='<h2>'+esc(TH[th][0])+'（'+g.length+'）</h2>';
  g.forEach(([w,s,_,t,n])=>{h+='<div class="row"><span class="w">'+esc(w)+'</span><span class="s">'+esc(s)+'</span><span class="m"><span class="t'+t+'">'+TN[t]+'</span><br>'+n+' 站</span></div>';});});
 list.innerHTML=h||'<p class="empty">沒有符合的字</p>';}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render();});
chips();render();
</script></html>
