<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>西洋棋初稿</title>
<style>
  :root { --bg: #f1efeb; --ink: #1d1c1a; --ink2: #66625b; --card: #fff; --line: #e2ddd5; --tag: #2f2b25; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171614; --ink: #f3f0ea; --ink2: #b4ada2; --card: #22201d; --line: #36322d; --tag: #f3f0ea; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 -apple-system, "PingFang TC", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
  a.back { color: var(--ink2); text-decoration: none; }
  h1 { font-size: 22px; margin: 12px 0 4px; }
  .lead { color: var(--ink2); margin: 4px 0 18px; }
  .shared { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; }
  .shared b { color: var(--ink); }
  .shared ul { margin: 6px 0 0; padding-left: 20px; color: var(--ink2); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 0 0 18px; }
  .head { display: flex; align-items: baseline; gap: 10px; margin: 2px 2px 6px; }
  .letter { font: 700 26px/1 Georgia, serif; color: var(--tag); }
  h2 { font-size: 19px; margin: 0; }
  section p { color: var(--ink2); margin: 2px 2px 10px; }
  section img { display: block; width: 100%; border-radius: 10px; margin-top: 8px; }
  .note { font-size: 13px; color: var(--ink2); margin: 8px 2px 0; }
</style>
</head>
<body>
<main>
  <a class="back" href="../../">← 所有測試</a>
  <h1>西洋棋：四個方向的初稿</h1>
  <p class="lead">每套都是完整六種棋子（國王、皇后、主教、騎士、城堡、士兵），都能直立免支撐列印。看完回我一個字母就好，也可以混搭，例如「B 的刻面＋D 的底座」。選定後我再精修細節。</p>
  <div class="shared">
    <b>四套共用、依你的回饋改的部分</b>
    <ul>
      <li>國王：清楚的拉丁十字（直桿長、橫臂在上三分之一），不再變形。</li>
      <li>騎士：重新雕的刻面馬頭——鼻樑稜、顴骨、下顎角、眉骨與眼窩、葉形耳朵（有耳窩）、鬃毛斜刻、喉部透空，每個角度都有體積。</li>
    </ul>
  </div>
  <div id="cards"></div>
</main>
<script>
  const drafts = [
    ['A', '像素 × 拋光', '你最初的構想重做：右上半是精緻拋光的曲面，左下半用同一尺寸的 2 mm 方塊重建，接縫是規律的 2:1 斜階（每往右一格就降兩格），不再有隨機碎塊。'],
    ['B', '晶體切面', '每一個面都是平面：六角形的環一層轉半格，整顆碎成寶石般的三角刻面，光線下每一面的明暗都不同。'],
    ['C', '旋疊方板', '每顆都是一疊 1.6 mm 的方板，每一片比下一片多轉 2.2°，整顆螺旋上升；板與板之間有細溝，看得出一層一層。騎士是把刻面馬頭切成同樣的板疊起來。'],
    ['D', '裝飾藝術', '1930 年代摩天樓的語彙：三層退台底座、柱身直溝、層層出挑的柱頭；皇后是放射狀的太陽芒皇冠，主教是克萊斯勒大樓式的退台尖塔。'],
  ];
  const notes = {
    A: '列印檢查：六顆都免支撐；最大懸空 2.0 mm（就是一格方塊的台階，一般印表機可直接印）。',
    B: '列印檢查：六顆都免支撐；最大懸空 1.2 mm（國王十字臂下），刻面馬頭 1.0 mm。',
    C: '列印檢查：國王的板疊十字臂目前懸空 4.4 mm、騎士下巴 3.1 mm，選這套的話精修時要加托架；其餘四顆 ≤ 1.3 mm。',
    D: '列印檢查：六顆都免支撐；最大懸空 1.2 mm（國王十字臂下）。',
  };
  document.getElementById('cards').innerHTML = drafts.map(([k, name, desc]) => `
    <section>
      <div class="head"><span class="letter">${k}</span><h2>${name}</h2></div>
      <p>${desc}</p>
      <a href="${k.toLowerCase()}-lineup.jpg"><img src="${k.toLowerCase()}-lineup.jpg" alt="${name}：白棋全套" loading="lazy"></a>
      <a href="${k.toLowerCase()}-close.jpg"><img src="${k.toLowerCase()}-close.jpg" alt="${name}：黑棋特寫" loading="lazy"></a>
      <div class="note" id="note-${k}">${notes[k] || ''}</div>
    </section>`).join('');
</script>
</body>
</html>
